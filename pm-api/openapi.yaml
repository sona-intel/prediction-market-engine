  /internal/v1/calibration:
    get:
      operationId: getCalibration
      tags: [Calibration]
      summary: Get how well market prices predicted outcomes
      description: |
        Call this to see how calibrated Polymarket prices were. A market is **well calibrated** when outcomes that were priced at 70 cents came true about 70% of the time. The table takes every resolved market with a price at the chosen time before it resolved, sorts the markets into 20 buckets of width 0.05 by that price, and compares the average price in each bucket with how often the outcome came true.

        The price of a market is the price of its first outcome (outcome 0) at the last trade at or before `horizon` hours ahead of the resolution time. The resolution time is the time of the first redemption in the market, which is a proxy. `horizon` is `4h`, `12h` (the default), `1d` or `1w`, and the body repeats it as `horizon_hours`: 4, 12, 24 or 168. The `market_kind` picks which markets to count:

        - `other` (the default) is the ordinary markets with question text. The skill ratings use only these.
        - `updown` is the short Up or Down markets, those whose question contains "up or down".
        - `unknown` is markets whose question text is missing.
        - `all` is the three kinds together.

        The body has `markets`, the number of markets counted, and `brier`, the mean squared gap between price and outcome (lower is better, and `null` when no market was counted). Each bucket has `lo` and `hi`, its `markets`, the `mean_price` of its markets and `observed`, the share that came true. A 50-50 resolution counts as one half. A bucket without markets shows zeros. A point on the line `observed = mean_price` is perfectly calibrated. `excluded.no_price` is the number of resolved markets of the chosen kind that have no price, because nothing traded before the horizon or the resolution time is unknown. They are left out of every bucket.

        Errors: 400 `invalid_query` for a `horizon` or `market_kind` that is not in its list. 503 `upstream_unavailable` when no valid database exists yet, and 504 `deadline_exceeded` when the budget runs out.
      parameters:
        - $ref: '#/components/parameters/Horizon'
        - $ref: '#/components/parameters/MarketKind'
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: The body is the calibration table for the chosen horizon and kind.
          headers: *stampHeaders
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PmCalibration'}
              examples:
