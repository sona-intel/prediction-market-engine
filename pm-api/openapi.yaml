  /internal/v1/pm/markets/top:
    get:
      operationId: getTopMarkets
      tags: [Live]
      summary: Get the Polymarket events with the most trading today
      description: |
        Call this to see which Polymarket events traded the most in the last 24 hours. The service polls Polymarket's Gamma API once a minute for the top 50 active, open events by 24-hour volume and keeps the answer in memory. `limit` is how many to return, 1 to 50, 20 by default, in volume order.

        An item is an `event_id`, `slug` and `title`, its `volume_24h_usd`, its all-time `volume_total_usd` (`null` when Polymarket sends none) and `liquidity_usd`, its `end_date` (RFC 3339 as Polymarket writes it, or `null` when the event has none) and its `markets`. A market is a `question` and `outcome_prices`, the current price of each outcome in order (for a Yes or No market, Yes first), each from 0 to 1. A market that has closed is left out, an event lists at most 10 markets, and an unreadable price list becomes an empty one. **The dollar amounts are plain JSON numbers**, because this is a live feed and not ledger data.

        `fetched_at` is when the copy was taken, to whole seconds in UTC. `stale` is `true` when the last poll failed and this is the last good copy, and the response then also has `X-Sona-Cache: stale`. `source` is always `polymarket-gamma`. The answer has no `coverage` object and no `Sona-*` stamp headers.

        **Other venues.** With `venue=kalshi`, `polymarket-us` or `hyperliquid` the answer is the most active markets of that venue from the recorded data, ranked by 24-hour volume (by total volume for `polymarket-us`, which reports no 24-hour figure), and its items and fields are those of `VenueMarket`. Only markets with a snapshot in the newest sweeps count for the first two, and Hyperliquid ranks the dollars traded in the last 24 hours with the last trade as the quote. `levr` has no market list and answers 400 `invalid_query`.

        Errors: 400 `invalid_query` for a `limit` that is not a whole number from 1 to 50, or a `venue` that is not served. 503 `upstream_unavailable` before the first poll has worked, with `Retry-After` 10, and for another venue when Postgres is down, with `Retry-After` 1. 504 `deadline_exceeded` only when `Sona-Deadline-Ms` is 0 or less.
      parameters:
        - $ref: '#/components/parameters/Venue'
        - name: limit
          in: query
          required: false
          description: |
            The most events to return, from 1 to 50. The default is 20. Anything that is not a whole number in that range answers 400 `invalid_query`.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
          examples:
            default: {summary: The default, value: 20}
            small: {summary: A short list, value: 2}
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: The feed has been polled at least once. The body is the list of events.
          headers: &liveHeaders
            X-Sona-Cache: {$ref: '#/components/headers/SonaCacheStale'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/PmTopMarkets'}, {$ref: '#/components/schemas/PmVenueTopMarkets'}]}
              examples:
                two:
                  summary: The two busiest events (limit=2)
                  value: {"kind": "pm_top_markets", "items": [{"event_id": "1109542", "slug": "ucl-atm-mnu-2026-10-13", "title": "Club Atletico de Madrid vs. Manchester United FC", "volume_24h_usd": 4115173.31, "volume_total_usd": 4199141.12, "liquidity_usd": 7916220.44, "end_date": "2026-10-13T19:00:00Z", "markets": [{"question": "Will Club Atletico de Madrid win on 2026-10-13?", "outcome_prices": [0.535, 0.465]}]}, {"event_id": "1109600", "slug": "open-ended", "title": "An event without an end date", "volume_24h_usd": 900.5, "volume_total_usd": null, "liquidity_usd": 10, "end_date": null, "markets": []}], "fetched_at": "2026-10-13T18:30:00Z", "stale": false, "source": "polymarket-gamma"}
                kalshi:
                  summary: The two Kalshi markets with the most 24-hour volume (venue=kalshi, limit=2)
                  value: {"kind": "pm_top_markets", "venue": "kalshi", "items": [{"market_id": "KXMLBGAME-26OCT142000MILLAD-LAD", "title": "Los Angeles D wins", "market_kind": "KXMLBGAME", "status": "open", "result": null, "close_time": "2026-10-18T00:00:00Z", "yes_price": 0.62, "volume_usd": 2075833.39, "open_interest_usd": 1965466.55, "volume_24h_usd": 1888224.08, "as_of": "2026-10-14T22:31:04Z"}, {"market_id": "KXMLBGAME-26OCT142000MILLAD-MIL", "title": "Milwaukee wins", "market_kind": "KXMLBGAME", "status": "open", "result": null, "close_time": "2026-10-18T00:00:00Z", "yes_price": 0.39, "volume_usd": 1703802.99, "open_interest_usd": 1585638.4, "volume_24h_usd": 1479360.36, "as_of": "2026-10-14T22:31:04Z"}], "as_of": "2026-10-14T22:31:04Z", "source": "kalshi-api", "coverage": {"venue": "kalshi", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:26Z", "mode": "partial_tape", "wallets": false, "gaps": null, "note": "Market snapshots of the 500 markets with the most 24-hour volume, and only the prints that cost the taker at least $10,000. Kalshi publishes no trader ids. History starts when recording started."}}
                polymarket_us:
                  summary: The two Polymarket US markets with the most volume (venue=polymarket-us, limit=2)
                  value: {"kind": "pm_top_markets", "venue": "polymarket-us", "items": [{"market_id": "paccc-usho-midterms-2026-11-03-rep", "title": "U.S House Midterm Winner: Republican Party", "market_kind": "election", "status": "open", "result": null, "close_time": "2027-02-02T04:59:00Z", "yes_price": 0.1085, "volume_usd": 51448391, "open_interest_usd": 3137604, "volume_24h_usd": null, "as_of": "2026-10-14T21:28:07Z"}, {"market_id": "tec-mlb-wsleague-2026-11-01-w-al", "title": "League to Win World Series: American League", "market_kind": "futures", "status": "open", "result": null, "close_time": "2026-11-16T04:00:00Z", "yes_price": 0.325, "volume_usd": 45735751, "open_interest_usd": 5716720.69, "volume_24h_usd": null, "as_of": "2026-10-14T21:27:15Z"}], "as_of": "2026-10-14T21:28:07Z", "source": "polymarket-us-gateway", "coverage": {"venue": "polymarket-us", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:23Z", "mode": "snapshot_only", "wallets": false, "gaps": null, "note": "Market snapshots of the busiest markets. The gateway has no trade tape and no trader ids. Volume and open interest are share counts valued in dollars. History starts when recording started."}}
                hyperliquid:
                  summary: The two HIP-4 outcomes with the most dollars traded in 24 hours (venue=hyperliquid, limit=2)
                  value: {"kind": "pm_top_markets", "venue": "hyperliquid", "items": [{"market_id": "#111390", "title": "Paris Saint Germain", "market_kind": "sportsContestParticipant2", "status": "closed", "result": null, "close_time": null, "yes_price": 0.9997, "volume_usd": null, "open_interest_usd": null, "volume_24h_usd": 6487.90957, "as_of": "2026-10-14T21:25:12Z"}, {"market_id": "#73500", "title": "xyz:SPCX 1-minute candle 135", "market_kind": "binaryPrice", "status": "open", "result": null, "close_time": "2026-10-30T20:00:00Z", "yes_price": 0.5, "volume_usd": null, "open_interest_usd": null, "volume_24h_usd": 5937.59796, "as_of": "2026-10-14T22:12:17Z"}], "as_of": "2026-10-14T22:12:17Z", "source": "hyperliquid-info", "coverage": {"venue": "hyperliquid", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:30Z", "mode": "recorded", "wallets": true, "gaps": 11, "note": "Every Hyperliquid HIP-4 outcome fill since recording started, read from the public WebSocket, with both wallets. A gap is a reconnect whose catch-up page did not reach the stored tape. Results appear once a settlement fill is found, so some settled outcomes may still show no result."}}
        "400":
          $ref: '#/components/responses/BadRequest'
          description: '`limit` is not a whole number from 1 to 50 (`invalid_query`).'
        "500": {$ref: '#/components/responses/Internal'}
        "503":
          $ref: '#/components/responses/LiveOrVenueUnavailable'
          description: The first poll of Polymarket has not worked yet (`upstream_unavailable`). `Retry-After` and `retry_after_s` are both 10 (seconds).
        "504": {$ref: '#/components/responses/DeadlineExceeded'}
  /internal/v1/pm/trades/large:
    get:
      operationId: getLargeTrades
      tags: [Live]
      summary: Get recent large Polymarket trades
      description: |
        Call this to see the latest big trades on Polymarket. The service polls Polymarket's Data API once a minute for the newest 200 trades worth at least $10,000 and keeps them in memory. `limit` is how many to return, 1 to 100, 50 by default, newest first. `min_usd` raises the floor above $10,000 and filters the kept trades, so it cannot go lower than the poll's own floor.

        An item has the transaction hash `tx` (several fills can share one), the `time` of the trade (RFC 3339 in UTC), the `wallet` that traded (Polymarket's proxy wallet), the market `question`, the `side` (`BUY` or `SELL`), the `outcome` that was traded, and `size` in shares, `price` per share from 0 to 1 and `usd`, which is `size` times `price` rounded to cents. **The amounts are plain JSON numbers**, because this is a live feed and not ledger data.

        `fetched_at`, `stale` and the `X-Sona-Cache: stale` header work as on the top markets route. `source` is always `polymarket-data`. With a high `min_usd` the list may be empty, because only the newest 200 trades of $10,000 or more are kept.

        **Other venues.** With `venue=kalshi` or `hyperliquid` the answer is the newest recorded trades of at least `min_usd`, from the collector's tape, and an item is a `VenueTrade`. Kalshi keeps only prints of at least $10,000 and has no wallets, so `wallet` is `null`. Hyperliquid fills are smaller, so its floor is $1,000, and `min_usd` in the answer says which floor applies. Its `wallet` is the taker. `polymarket-us` has no trade tape and `levr` has positions and not trades, so both answer 400 `invalid_query`.

        Errors: 400 `invalid_query` for a `limit` outside 1 to 100, a `min_usd` below the venue's floor (10000, or 1000 on Hyperliquid) or not a number, or a `venue` that is not served. 503 `upstream_unavailable` before the first poll has worked, with `Retry-After` 10, and for another venue when Postgres is down, with `Retry-After` 1. 504 `deadline_exceeded` only when `Sona-Deadline-Ms` is 0 or less.
      parameters:
        - $ref: '#/components/parameters/Venue'
        - name: limit
          in: query
          required: false
          description: |
            The most trades to return, from 1 to 100. The default is 50. Anything that is not a whole number in that range answers 400 `invalid_query`.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
          examples:
            default: {summary: The default, value: 50}
            small: {summary: A short list, value: 2}
        - name: min_usd
          in: query
          required: false
          description: |
            The smallest trade to return, in US dollars, at most 1000000000000. The venue sets the default and the least value: 10000 on Polymarket and Kalshi, and 1000 on Hyperliquid, whose fills are smaller. A smaller or unreadable value answers 400 `invalid_query`.
          schema: {type: number, minimum: 1000, maximum: 1000000000000}
          examples:
            default: {summary: The default floor, value: 10000}
            whales: {summary: Only trades of 50 thousand dollars or more, value: 50000}
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: The feed has been polled at least once. The body is the list of trades, which may be empty.
          headers: *liveHeaders
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/PmLargeTrades'}, {$ref: '#/components/schemas/PmVenueLargeTrades'}]}
              examples:
                two:
                  summary: The two newest large trades (limit=2)
                  value: {"kind": "pm_large_trades", "items": [{"tx": "0x3db3131c0c9674d312cbf871ed607837098862704501a2510a5ced86f143224f", "time": "2026-10-13T18:29:57Z", "wallet": "0x0f6f76ced62a911bccef92f50faaff143854d977", "question": "Will PSV win on 2026-10-13?", "side": "BUY", "outcome": "Yes", "size": 70000, "price": 0.19, "usd": 13300}, {"tx": "0x35ebc3d9fc2033c74ea27f9e7b96b8baf6085a9c6b9fc0a2d1e5d0ff5bd6c1c2", "time": "2026-10-13T18:29:57Z", "wallet": "0x5815db9fdf0e0ffdc1d1f759916b221339570ae7", "question": "Spread: FC Barcelona (-1.5)", "side": "BUY", "outcome": "Galatasaray SK", "size": 20683.384694, "price": 0.4834798631, "usd": 10000}], "fetched_at": "2026-10-13T18:30:00Z", "stale": false, "source": "polymarket-data"}
                kalshi:
                  summary: The two newest Kalshi prints of at least $10,000 (venue=kalshi, limit=2)
                  value: {"kind": "pm_large_trades", "venue": "kalshi", "min_usd": 10000, "items": [{"id": "0725c8d0-9ad1-ac44-90e2-41e6bdcebff0", "time": "2026-10-14T22:30:33Z", "market_id": "KXNCAAFTOTAL-26OCT14WKUSHSU-53", "question": "Full Game: Over 52.5 points scored", "side": "yes", "wallet": null, "size": 32508.41, "yes_price": 0.53, "usd": 17229.4573}, {"id": "0725cea3-0eb1-abce-2bcf-79f884a51035", "time": "2026-10-14T22:29:52Z", "market_id": "KXITFMATCH-26OCT14STOCUN-CUN", "question": "Julian Cundom wins", "side": "yes", "wallet": null, "size": 12188, "yes_price": 0.94, "usd": 11456.72}], "source": "kalshi-api", "coverage": {"venue": "kalshi", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:26Z", "mode": "partial_tape", "wallets": false, "gaps": null, "note": "Market snapshots of the 500 markets with the most 24-hour volume, and only the prints that cost the taker at least $10,000. Kalshi publishes no trader ids. History starts when recording started."}}
                hyperliquid_none:
                  summary: No HIP-4 fill of $10,000 has been recorded (venue=hyperliquid)
                  value: {"kind": "pm_large_trades", "venue": "hyperliquid", "min_usd": 1000, "items": [], "source": "hyperliquid-info", "coverage": {"venue": "hyperliquid", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:30Z", "mode": "recorded", "wallets": true, "gaps": 11, "note": "Every Hyperliquid HIP-4 outcome fill since recording started, read from the public WebSocket, with both wallets. A gap is a reconnect whose catch-up page did not reach the stored tape. Results appear once a settlement fill is found, so some settled outcomes may still show no result."}}
        "400":
          $ref: '#/components/responses/BadRequest'
          description: '`limit` is not a whole number from 1 to 100, or `min_usd` is not a number of at least 10000 (`invalid_query`).'
        "500": {$ref: '#/components/responses/Internal'}
        "503":
          $ref: '#/components/responses/LiveOrVenueUnavailable'
          description: The first poll of Polymarket has not worked yet (`upstream_unavailable`). `Retry-After` and `retry_after_s` are both 10 (seconds).
        "504": {$ref: '#/components/responses/DeadlineExceeded'}
  /internal/v1/pm/venues:
    get:
      operationId: getVenues
      tags: [Venues]
      summary: List the venues the service knows
      description: |
        Call this to see which venues you can pass as `venue`, how each is recorded and when it was last read. The first item is `polymarket`, whose `since` is the date of its first order-book trade and whose `last_ok` is the time of the last good poll of the live feed (`null` before the first poll). The others come from the collector: `since` is when recording started and `last_ok` the end of the last collector job that worked.

        `mode` says what the record is. `history_and_live` is Polymarket. `recorded` is a full tape since `since`, with wallets. `partial_tape` is market snapshots plus only the trades above a size floor. `snapshot_only` is market snapshots and no trades. `wallets` is `true` where traders have ids and so a trader route and leaderboards exist. `note` states the limits in a sentence.

        Errors: 503 `upstream_unavailable` when Postgres cannot be reached, with `Retry-After` 1. 504 `deadline_exceeded` when the budget runs out.
      parameters:
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: The venue table was read. The body is the list of venues.
          headers: &venueHeaders
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PmVenues'}
              examples:
                recorded:
                  summary: Polymarket and the four recorded venues
                  value: {"kind": "pm_venues", "items": [{"code": "polymarket", "name": "Polymarket", "quote": "USDC", "wallets": true, "since": "2022-11-21T00:00:00Z", "last_ok": "2026-10-14T22:47:24Z", "mode": "history_and_live", "note": "Order-book history through Polygon block 85,948,288 on 2026-04-24, and a live feed of the busiest markets and largest recent trades."}, {"code": "hyperliquid", "name": "Hyperliquid HIP-4", "quote": "USDC", "wallets": true, "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:30Z", "mode": "recorded", "note": "Every Hyperliquid HIP-4 outcome fill since recording started, read from the public WebSocket, with both wallets. A gap is a reconnect whose catch-up page did not reach the stored tape. Results appear once a settlement fill is found, so some settled outcomes may still show no result."}, {"code": "kalshi", "name": "Kalshi", "quote": "USD", "wallets": false, "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:26Z", "mode": "partial_tape", "note": "Market snapshots of the 500 markets with the most 24-hour volume, and only the prints that cost the taker at least $10,000. Kalshi publishes no trader ids. History starts when recording started."}, {"code": "levr", "name": "Levr Bet", "quote": "USDC", "wallets": true, "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:26Z", "mode": "recorded", "note": "Leveraged positions, liquidations and settlements of Levr Bet on Monad, read from the venue's unofficial indexer. Payouts are worked out from redemption rows, and void refunds and the partial return of a liquidation are not published. Positions opened before recording started are missing."}, {"code": "polymarket-us", "name": "Polymarket US", "quote": "USD", "wallets": false, "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:23Z", "mode": "snapshot_only", "note": "Market snapshots of the busiest markets. The gateway has no trade tape and no trader ids. Volume and open interest are share counts valued in dollars. History starts when recording started."}]}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
        "504": {$ref: '#/components/responses/DeadlineExceeded'}
  /internal/v1/pm/markets/{venue}/{id}/history:
    get:
      operationId: getMarketHistory
      tags: [Venues]
      summary: Get the recorded history of one market
      description: |
        Call this to chart one market of Kalshi, Polymarket US or Hyperliquid from what the collector recorded. The `id` is the `market_id` of the top markets route (a Hyperliquid id starts with `#`, written `%23` in a path).

        For `kalshi` and `polymarket-us` an item is a snapshot of the market: the Yes price and the volume, open interest and 24-hour volume the venue reported, with `null` for a figure the venue does not report. Kalshi snapshots only the 500 markets with the most 24-hour volume, so a quieter market has a few points or none. For `hyperliquid` there are no snapshots, and an item is the last trade price in a 5 minute bucket of the fill tape, with the three volume fields `null`.

        Items run oldest first from `since` (RFC 3339, the last 24 hours by default) and are cut to `limit` (1 to 1000, 200 by default), so a long window needs a larger `limit` or a later `since`. The market block repeats what the venue says about the market, with `result` set once it has settled and `null` before.

        Errors: 400 `invalid_query` for a `venue` that has no history (`levr` and `polymarket` do not), a `since` that is not a time, or a `limit` outside 1 to 1000. 404 `not_found` for a market that was never recorded. 503 `upstream_unavailable` when Postgres cannot be reached, with `Retry-After` 1. 504 `deadline_exceeded` when the budget runs out.
      parameters:
        - $ref: '#/components/parameters/VenuePath'
        - $ref: '#/components/parameters/MarketId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: The market is recorded. The body is its history, which may be empty.
          headers: *venueHeaders
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PmMarketHistory'}
              examples:
                kalshi:
                  summary: Three snapshots of a Kalshi market (venue=kalshi, limit=3)
                  value: {"kind": "pm_market_history", "venue": "kalshi", "market": {"id": "KXMLBGAME-26OCT142000MILLAD-LAD", "title": "Los Angeles D wins", "market_kind": "KXMLBGAME", "status": "open", "result": null, "close_time": "2026-10-18T00:00:00Z"}, "items": [{"time": "2026-10-14T22:00:21Z", "yes_price": 0.62, "volume_usd": 1822758.99, "open_interest_usd": 1718325.19, "volume_24h_usd": 1643687.43}, {"time": "2026-10-14T22:05:45Z", "yes_price": 0.62, "volume_usd": 1847410.14, "open_interest_usd": 1741711.4, "volume_24h_usd": 1643687.43}, {"time": "2026-10-14T22:31:04Z", "yes_price": 0.62, "volume_usd": 2075833.39, "open_interest_usd": 1965466.55, "volume_24h_usd": 1888224.08}], "source": "kalshi-api", "coverage": {"venue": "kalshi", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:53Z", "mode": "partial_tape", "wallets": false, "gaps": 1, "note": "Market snapshots of the 500 markets with the most 24-hour volume, and only the prints that cost the taker at least $10,000. Kalshi publishes no trader ids. History starts when recording started."}}
                polymarket_us:
                  summary: Snapshots of a Polymarket US market, which has no 24-hour volume
                  value: {"kind": "pm_market_history", "venue": "polymarket-us", "market": {"id": "paccc-usho-midterms-2026-11-03-rep", "title": "U.S House Midterm Winner: Republican Party", "market_kind": "election", "status": "open", "result": null, "close_time": "2027-02-02T04:59:00Z"}, "items": [{"time": "2026-10-14T21:11:02Z", "yes_price": 0.1085, "volume_usd": 51448391, "open_interest_usd": 3137604, "volume_24h_usd": null}, {"time": "2026-10-14T21:28:07Z", "yes_price": 0.1085, "volume_usd": 51448391, "open_interest_usd": 3137604, "volume_24h_usd": null}], "source": "polymarket-us-gateway", "coverage": {"venue": "polymarket-us", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:23Z", "mode": "snapshot_only", "wallets": false, "gaps": null, "note": "Market snapshots of the busiest markets. The gateway has no trade tape and no trader ids. Volume and open interest are share counts valued in dollars. History starts when recording started."}}
                hyperliquid:
                  summary: Last trade price per 5 minutes of a HIP-4 outcome
                  value: {"kind": "pm_market_history", "venue": "hyperliquid", "market": {"id": "#73500", "title": "xyz:SPCX 1-minute candle 135", "market_kind": "binaryPrice", "status": "open", "result": null, "close_time": "2026-10-30T20:00:00Z"}, "items": [{"time": "2026-10-14T21:10:00Z", "yes_price": 0.70463, "volume_usd": null, "open_interest_usd": null, "volume_24h_usd": null}, {"time": "2026-10-14T21:40:00Z", "yes_price": 0.705, "volume_usd": null, "open_interest_usd": null, "volume_24h_usd": null}, {"time": "2026-10-14T22:10:00Z", "yes_price": 0.5, "volume_usd": null, "open_interest_usd": null, "volume_24h_usd": null}], "source": "hyperliquid-info", "coverage": {"venue": "hyperliquid", "since": "2026-10-14T20:18:26Z", "last_ok": "2026-10-14T22:47:53Z", "mode": "recorded", "wallets": true, "gaps": 11, "note": "Every Hyperliquid HIP-4 outcome fill since recording started, read from the public WebSocket, with both wallets. A gap is a reconnect whose catch-up page did not reach the stored tape. Results appear once a settlement fill is found, so some settled outcomes may still show no result."}}
        "400":
          $ref: '#/components/responses/BadRequest'
          description: The `venue` has no history, `since` is not a time, or `limit` is not a whole number from 1 to 1000 (`invalid_query`).
        "404":
          $ref: '#/components/responses/NotFound'
          description: The market was never recorded for this venue (`not_found`).
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
        "504": {$ref: '#/components/responses/DeadlineExceeded'}
  /healthz:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Check that the process is alive
      description: |
        The liveness probe. It answers 200 with an empty body as long as the process runs, whether or not a database is loaded. Use it to tell a process that is down from one that is up but has nothing to serve, which is what `/readyz` reports. It sends `X-Request-Id` but no `Sona-*` header.
      responses:
        "200":
          description: The process is running. The body is empty.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
  /readyz:
    get:
      operationId: getReady
      tags: [Operations]
      summary: Check that the service can answer requests
      description: |
        The readiness probe. It answers 200 while a valid database is open and 503 while there is none: the first build has not finished, or the file is not a DuckDB database. The service checks for a new or replaced file every 10 seconds, so a probe turns 200 within one check of a valid file appearing. The body is empty in both cases, and unlike the data routes a 503 here has no problem body and no `Retry-After`. It sends `X-Request-Id` but no `Sona-*` header.
      responses:
        "200":
          description: A database is open and the service can answer requests. The body is empty.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        "503":
          description: No valid database is open. The data routes answer 503 too. The body is empty.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
components:
  parameters:
    Wallet:
      name: wallet
      in: path
      required: true
      description: |
        The wallet to read: `0x` followed by 40 hex digits, in upper, lower or mixed case. The service lowercases it and does not check the EIP-55 capitals. The `0X` prefix with a capital X is not accepted. The answer carries the lowercase form. It is part of the path, so there is no default.
      schema: {$ref: '#/components/schemas/AddressAnyCase'}
      examples:
        golden: {summary: A wallet with 11 resolved markets, value: "0x467ecfc0c6265683e90899C41881c0431bDEE2ed"}
        rated: {summary: A rated wallet, value: "0x6326fC8A7361717B3926287f2998c91ee4fAADE2"}
        flagged: {summary: A wallet with flagged trades, value: "0x0ef286b836e4efa2aa3403cfba1baa6c54d8e986"}
    Board:
      name: board
      in: path
      required: true
      description: |
        Which leaderboard to read: `pnl` (net profit), `volume` (USDC volume) or `skill` (the lower bound of the forecasting edge, rated wallets only), in lowercase. It is part of the path, so there is no default.
      schema: {type: string, enum: [pnl, volume, skill]}
      examples:
        pnl: {summary: Ranked by net profit, value: pnl}
        volume: {summary: Ranked by volume, value: volume}
        skill: {summary: Ranked by skill, value: skill}
    Limit:
      name: limit
      in: query
      required: false
      description: |
        The most rows to return, from 1 to 100. The default is 50. Anything that is not a whole number in that range answers 400 `invalid_query`.
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      examples:
        default: {summary: The default page, value: 50}
        small: {summary: A short page, value: 3}
    Offset:
      name: offset
      in: query
      required: false
      description: |
        How many rows to skip, from 0 to 10000. The default is 0. The first row of the answer has the rank `offset + 1`. Anything that is not a whole number in that range answers 400 `invalid_query`. A value past the end of the board gives an empty page and not an error.
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      examples:
        first: {summary: The first page, value: 0}
        second: {summary: The second page of 50, value: 50}
    Horizon:
      name: horizon
      in: query
      required: false
      description: |
        How long before a market resolved to take its price: `4h`, `12h`, `1d` or `1w`. The default is `12h`, the horizon that the skill ratings use. Anything else answers 400 `invalid_query`.
      schema: {type: string, enum: [4h, 12h, 1d, 1w], default: 12h}
      examples:
        default: {summary: Twelve hours, value: 12h}
        week: {summary: One week, value: 1w}
    MarketKind:
      name: market_kind
      in: query
      required: false
      description: |
        Which markets to count: `other` (ordinary markets with question text), `updown` (short Up or Down markets), `unknown` (markets without question text) or `all`. The default is `other`. Anything else answers 400 `invalid_query`.
      schema: {type: string, enum: [other, updown, unknown, all], default: other}
      examples:
        default: {summary: Ordinary markets, value: other}
        all: {summary: Every kind, value: all}
    Venue:
      name: venue
      in: query
      required: false
      description: |
        Which venue to read: `polymarket` (the default, so a call without it answers as before), `kalshi`, `polymarket-us`, `hyperliquid` or `levr`. Each route says which venues it serves, and one it does not serve answers 400 `invalid_query`, as does any other value.
      schema: {type: string, enum: [polymarket, kalshi, polymarket-us, hyperliquid, levr], default: polymarket}
      examples:
        default: {summary: The default, value: polymarket}
        kalshi: {summary: Kalshi, value: kalshi}
        hyperliquid: {summary: Hyperliquid HIP-4, value: hyperliquid}
        levr: {summary: Levr Bet, value: levr}
    VenuePath:
      name: venue
      in: path
      required: true
      description: |
        The venue whose market to read: `kalshi`, `polymarket-us` or `hyperliquid`. `polymarket` has no recorded history here and `levr` has no markets, and both answer 400 `invalid_query`.
      schema: {type: string, enum: [kalshi, polymarket-us, hyperliquid]}
      examples:
        kalshi: {summary: Kalshi, value: kalshi}
        hyperliquid: {summary: Hyperliquid HIP-4, value: hyperliquid}
    MarketId:
      name: id
      in: path
      required: true
      description: |
        The venue's id of the market, the `market_id` of the top markets route. A Kalshi id is a ticker, a Polymarket US id is a slug and a Hyperliquid id is `#` and a number, written `%23` in a path.
      schema: {type: string, minLength: 1}
      examples:
        kalshi: {summary: A Kalshi ticker, value: KXMLBGAME-26OCT142000MILLAD-LAD}
        hyperliquid: {summary: A HIP-4 outcome, value: "#73500"}
    Since:
      name: since
      in: query
      required: false
      description: |
        The start of the window as an RFC 3339 time, such as `2026-10-14T12:00:00Z`. The default is 24 hours before the call. Anything that is not a time answers 400 `invalid_query`.
      schema: {type: string, format: date-time}
      examples:
        day: {summary: From noon on a day, value: "2026-10-14T12:00:00Z"}
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: |
        The most items to return, from 1 to 1000. The default is 200. Anything that is not a whole number in that range answers 400 `invalid_query`.
      schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      examples:
        default: {summary: The default, value: 200}
        small: {summary: A short list, value: 3}
    DeadlineMs:
      name: Sona-Deadline-Ms
      in: header
      required: false
      description: |
        The most time, in milliseconds, that this call may take. The default is 5000, used when the header is absent or is not a whole number (`abc` and `1.5` are ignored). When the time runs out before the database has answered, the call ends with 504 `deadline_exceeded`. A value of 0 or less answers 504 straight away without reading anything. The HTTP server's own write timeout is 10 s, so a budget above 10000 cannot be used in full. `sona-api` fills this header in itself with the time it has left.
      schema: {type: integer, format: int64}
      examples:
        default: {summary: The default budget of 5 s, value: 5000}
        short: {summary: Wait at most 400 ms, value: 400}
  headers:
    SonaFinality:
      description: |
        How settled the data is. It is always `finalized`, because the history ends at a block that is long final. It is present on every successful Polymarket history answer, and absent from errors, probes and answers for another venue.
      required: false
      schema: {type: string, enum: [finalized]}
      example: finalized
    SonaBlock:
      description: |
        The Polygon block number that the data goes through, as a decimal integer. It is `85948288` for every answer, the last block of the dataset. It is the same as `coverage.through.block` in the body and is absent from errors, probes and answers for another venue.
      required: false
      schema: {type: integer, minimum: 0}
      example: 85948288
    SonaBlockTime:
      description: |
        The timestamp of that block as Unix time in whole seconds (UTC). It is `1777016620` for every answer, which is 2026-04-24T07:43:40Z, the same instant as `coverage.through.time` in the body. It is absent from errors, probes and answers for another venue.
      required: false
      schema: {type: integer, minimum: 0}
      example: 1777016620
    RequestId:
      description: |
        A random 16-digit hex id that identifies this one request in the service log. Quote it when you report a problem. It is present on every answer, including the probes and the errors.
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{16}$'}
      example: 9f3a1c07be52d684
    NoStore:
      description: |
        Always `no-store` on an error answer. It tells caches not to keep a problem, because the same request may succeed a moment later. Successful answers carry no `Cache-Control`.
      required: true
      schema: {type: string, enum: [no-store]}
      example: no-store
    RetryAfter:
      description: |
        How many whole seconds to wait before you send the request again. It is always `1` and is present on 503 data answers.
      required: true
      schema: {type: integer, enum: [1]}
      example: 1
    SonaCacheStale:
      description: |
        Present on a live answer, with the value `stale`, only when the last poll of Polymarket failed and the body is the last good copy. The body says the same in `stale`.
      required: false
      schema: {type: string, enum: [stale]}
      example: stale
    AnyRetryAfter:
      description: |
        How many whole seconds to wait before you send the request again. It is `10` while the Polymarket live feed has not been polled yet and `1` when Postgres cannot be reached.
      required: true
      schema: {type: integer, enum: [1, 10]}
      example: 10
    LiveRetryAfter:
      description: |
        How many whole seconds to wait before you send the request again. It is always `10` on the 503 of a live route, because the poller runs once a minute.
      required: true
      schema: {type: integer, enum: [10]}
      example: 10
  responses:
    BadRequest:
      description: The request is not valid. The code is `invalid_id` for a wallet or board in the path and `invalid_query` for a query parameter. Each route says what it accepts.
      headers: &problemHeaders
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {allOf: [{$ref: '#/components/schemas/Problem'}, {properties: {code: {enum: [invalid_id, invalid_query]}}}]}
    NotFound:
      description: Nothing is there (`not_found`). That is a wallet with no fills, a market or a venue wallet that was never recorded, and also a path or method that no route serves, which has the detail `No such route.`.
      headers: *problemHeaders
      content:
        application/problem+json:
          schema: {allOf: [{$ref: '#/components/schemas/Problem'}, {properties: {code: {enum: [not_found]}}}]}
    Internal:
      description: The service failed in a way it has no name for (`internal`). It is not worth retrying until the cause is fixed. Report the `X-Request-Id`, because the cause is in the service log under that id. The body never holds the cause.
      headers: *problemHeaders
      content:
        application/problem+json:
          schema: {allOf: [{$ref: '#/components/schemas/Problem'}, {properties: {code: {enum: [internal]}}}]}
    Unavailable:
      description: The service has no database to read (`upstream_unavailable`). No valid database file exists yet, because the first build has not finished or the file is not a DuckDB database, or, on a venue route, Postgres cannot be reached. The service looks again every 10 seconds, so retry. `Retry-After` and `retry_after_s` are both 1 (second).
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {allOf: [{$ref: '#/components/schemas/Problem'}, {properties: {code: {enum: [upstream_unavailable]}}}, {required: [retry_after_s]}]}
    LiveUnavailable:
      description: The first poll of Polymarket has not worked yet (`upstream_unavailable`). `Retry-After` and `retry_after_s` are both 10 (seconds).
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/LiveRetryAfter'}
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {allOf: [{$ref: '#/components/schemas/Problem'}, {properties: {code: {enum: [upstream_unavailable]}, retry_after_s: {enum: [10]}}}, {required: [retry_after_s]}]}
    LiveOrVenueUnavailable:
      description: The data is not available (`upstream_unavailable`). For `polymarket` the first poll of Polymarket has not worked yet, and `Retry-After` and `retry_after_s` are 10 (seconds). For another venue Postgres cannot be reached, and both are 1.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/AnyRetryAfter'}
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {allOf: [{$ref: '#/components/schemas/Problem'}, {properties: {code: {enum: [upstream_unavailable]}, retry_after_s: {enum: [1, 10]}}}, {required: [retry_after_s]}]}
    DeadlineExceeded:
      description: The time budget ran out (`deadline_exceeded`). Either the database had not answered within `Sona-Deadline-Ms` (5000 ms when the header is absent), or the header was 0 or less. Retry, with a larger budget if the call is a slow one.
      headers: *problemHeaders
      content:
        application/problem+json:
          schema: {allOf: [{$ref: '#/components/schemas/Problem'}, {properties: {code: {enum: [deadline_exceeded]}}}]}
  schemas:
    Address:
      type: string
      description: A 20-byte address written as `0x` followed by 40 lowercase hex digits.
      pattern: '^0x[0-9a-f]{40}$'
      examples: ["0x467ecfc0c6265683e90899c41881c0431bdee2ed"]
    AddressAnyCase:
      type: string
      description: A 20-byte address written as `0x` followed by 40 hex digits. A request may use uppercase, lowercase or mixed letters. The service treats it as lowercase and does not check the EIP-55 capitals.
      pattern: '^0x[0-9a-fA-F]{40}$'
      examples: ["0x467ecfc0c6265683e90899C41881c0431bDEE2ed"]
    Hash32:
      type: string
      description: A 32-byte hash written as `0x` followed by 64 lowercase hex digits. A market's condition id has this form.
      pattern: '^0x[0-9a-f]{64}$'
      examples: ["0xc0d117acf059a4870b116b50732020883e24dfc3577249ff37a74c6ce77d1f4d"]
    Time:
      type: string
      format: date-time
      description: A point in time in RFC 3339 format in UTC, to whole seconds, ending in `Z`.
      examples: ["2025-07-09T04:21:12Z"]
    Ratio:
      type: number
      minimum: 0
      maximum: 1
      description: A share or probability from 0 to 1.
    Amount:
      description: An amount of USDC (dollars) or of outcome shares, given both exactly and in a readable form.
      type: object
      additionalProperties: false
      required: [raw, decimals, symbol, value]
      properties:
        raw:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)$'
          description: The exact amount in millionths of the unit, as a signed decimal string. For example `-16628825094` is a loss of $16,628.825094.
          examples: ["716582888996"]
        decimals:
          type: integer
          enum: [6]
          description: How many decimal places the unit has, so `value` is `raw` divided by 10 to the power of `decimals`. It is always 6.
        symbol:
          type: string
          enum: [USDC, shares]
          description: '`USDC` for money in dollars and `shares` for outcome shares.'
        value:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$'
          description: The amount in whole units as an exact decimal string, without trailing zeros. Zero is `0`. For a `raw` of `716582888996` it is `716582.888996`.
          examples: ["716582.888996"]
    Coverage:
      description: What period the data covers, where it comes from and the notices that must go with it.
      type: object
      additionalProperties: false
      required: [note, through, revision, attribution, license_url, modified, source_url]
      properties:
        note:
          type: string
          description: A plain-language statement of the period covered and of what is left out.
        through:
          type: object
          additionalProperties: false
          required: [block, time]
          description: The last Polygon block of the data.
          properties:
            block:
              type: integer
              description: The block number, `85948288`.
            time:
              description: The time of that block, `2026-04-24T07:43:40Z`.
              $ref: '#/components/schemas/Time'
        revision:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: The commit of the source dataset that was read. It is pinned, so a rebuild reads the same data.
        attribution:
          type: string
          description: The credit line that must be shown with the data.
        license_url:
          type: string
          format: uri
          description: The licence of the source data, Creative Commons Attribution 4.0.
        modified:
          type: string
          description: The notice that Sona changed the source rows and is not affiliated with Polymarket or Envio.
        source_url:
          type: string
          format: uri
          description: The page of the source dataset.
    Problem:
      description: An error in the RFC 9457 `application/problem+json` format. Switch on `code`; the text fields are for people.
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URN that identifies the kind of error, `urn:sona:problem:` followed by the `code`.
          examples: ["urn:sona:problem:not_found"]
        title:
          type: string
          description: A short, fixed, human-readable name for the kind of error.
          examples: [Not found]
        status:
          type: integer
          description: The HTTP status code of the answer, repeated in the body.
          examples: [404]
        detail:
          type: string
          description: A sentence explaining what went wrong for this request. The wording may change, so do not parse it.
          examples: [Nothing was found for this identifier.]
        instance:
          type: string
          description: The path of the request that failed.
          examples: ["/internal/v1/traders/0x1234567890123456789012345678901234567890"]
        code:
          type: string
          description: |
            The stable machine-readable reason. `invalid_id` the wallet or board in the path is not valid; `invalid_query` a query parameter is not accepted; `not_found` nothing is there; `internal` an unexpected failure; `upstream_unavailable` no database is loaded; `deadline_exceeded` it was too slow.
          enum:
            - invalid_id
            - invalid_query
            - not_found
            - internal
            - upstream_unavailable
            - deadline_exceeded
        retry_after_s:
          type: integer
          minimum: 1
          description: How many whole seconds to wait before retrying. Present on `upstream_unavailable`, and equal to the `Retry-After` header.
          examples: [1]
    PmStatus:
      description: The state of the loaded database.
      type: object
      additionalProperties: false
      required: [kind, ready, built_at, rules_version, totals, coverage]
      properties:
        kind:
          type: string
          enum: [pm_status]
          description: Always `pm_status`. It names the shape of this object.
        ready:
          type: boolean
          description: Always `true` in an answer, because a service without a database answers 503.
        built_at:
          type: string
          format: date-time
          description: When the build published this file, in UTC to the millisecond.
          examples: ["2026-10-12T15:50:55.520Z"]
        rules_version:
          type: string
          description: The version of the rules that computed every figure. It changes whenever a rule changes.
          examples: [pm-rules-1]
        totals:
          type: object
          additionalProperties: false
          required: [fills, wallets, rated_wallets, markets, resolved_markets]
          description: How much the database holds.
          properties:
            fills:
              type: integer
              minimum: 0
              description: The fills over all wallets. A match between two wallets is one fill for each, so it counts twice.
            wallets:
              type: integer
              minimum: 0
              description: The wallets with at least one fill, which are the wallets that have a profile.
            rated_wallets:
              type: integer
              minimum: 0
              description: The wallets that reached the skill floor of 30 rated markets in at least 3 events.
            markets:
              type: integer
              minimum: 0
              description: The markets in the database.
            resolved_markets:
              type: integer
              minimum: 0
              description: The markets that had resolved by the cutoff.
        coverage: {$ref: '#/components/schemas/Coverage'}
    PmTrader:
      description: The full record of one wallet.
      type: object
      additionalProperties: false
      required: [kind, wallet, owner, owner_kind, activity, pnl, skill, wash, coverage]
      properties:
        kind:
          type: string
          enum: [pm_trader]
          description: Always `pm_trader`. It names the shape of this object.
        wallet:
          description: The wallet, in lowercase.
          $ref: '#/components/schemas/Address'
        owner:
          description: The account that controls the wallet, when Polymarket's wallet registry lists it, and `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: "null"
        owner_kind:
          type: [string, "null"]
          enum: [proxy, safe, null]
          description: What kind of contract the wallet is, `proxy` or `safe`, and `null` when the registry does not list it.
        activity:
          type: object
          additionalProperties: false
          required: [fills, markets, volume, buy_volume, taker_fills, taker_volume, first_trade, last_trade]
          description: What the wallet traded, counted on its own side so that nothing is counted twice.
          properties:
            fills:
              type: integer
              minimum: 1
              description: The number of the wallet's own fills.
            markets:
              type: integer
              minimum: 0
              description: The markets in which the wallet has any event, a fill, a split, a merge, a redemption or a conversion.
            volume:
              description: The value of its fills in USDC.
              $ref: '#/components/schemas/Amount'
            buy_volume:
              description: The part of `volume` that was buying.
              $ref: '#/components/schemas/Amount'
            taker_fills:
              type: integer
              minimum: 0
              description: The fills in which the wallet's order took liquidity from the book.
            taker_volume:
              description: The value of the taker fills in USDC.
              $ref: '#/components/schemas/Amount'
            first_trade:
              description: The time of the first fill.
              $ref: '#/components/schemas/Time'
            last_trade:
              description: The time of the last fill.
              $ref: '#/components/schemas/Time'
        pnl:
          type: object
          additionalProperties: false
          required: [realized, gross, fees, biggest_win, resolved_markets, won_markets, win_rate, open_unresolved_positions, final, amm_trades_excluded]
          description: Lifetime profit and loss in USDC, with settlement of resolved markets and fees taken off.
          properties:
            realized:
              description: The net result, `gross` minus `fees`. Negative for a loss. When `final` is `false` it is the result so far.
              $ref: '#/components/schemas/Amount'
            gross:
              description: The result before fees.
              $ref: '#/components/schemas/Amount'
            fees:
              description: The fees the wallet paid, from 2026-01-06 04:51:15 UTC. Zero before that.
              $ref: '#/components/schemas/Amount'
            biggest_win:
              description: The best net result in any single market, and 0 when it is $1.00 or less.
              $ref: '#/components/schemas/Amount'
            resolved_markets:
              type: integer
              minimum: 0
              description: The markets of the wallet that had resolved by the cutoff.
            won_markets:
              type: integer
              minimum: 0
              description: The resolved markets with a net result above 0. It never exceeds `resolved_markets`.
            win_rate:
              type: object
              additionalProperties: false
              required: [value, wilson_lower, shown, floor]
              description: The share of resolved markets that were won, shown only from the floor.
              properties:
                value:
                  type: [number, "null"]
                  minimum: 0
                  maximum: 1
                  description: '`won_markets` divided by `resolved_markets`, to 4 decimals. `null` below the floor.'
                wilson_lower:
                  type: [number, "null"]
                  minimum: 0
                  maximum: 1
                  description: The lower bound of the 95% Wilson confidence interval of `value`, to 4 decimals. `null` below the floor.
                shown:
                  type: boolean
                  description: '`true` from the floor of resolved markets, and `false` below it.'
                floor:
                  type: integer
                  description: The number of resolved markets from which the win rate is shown, 30.
            open_unresolved_positions:
              type: integer
              minimum: 0
              description: The positions in markets that had not resolved by the cutoff. They are not valued.
            final:
              type: boolean
              description: '`true` when the wallet has no open unresolved position, so `realized` will not change.'
            amm_trades_excluded:
              type: integer
              minimum: 0
              description: The wallet's trades on the old automated market maker, which are not part of the result.
        skill:
          type: object
          additionalProperties: false
          required: [rated, floor, horizon_hours, markets, events, brier, edge, edge_se, calibration]
          description: How good the wallet's forecasts were, measured 12 hours before each market resolved.
          properties:
            rated:
              type: boolean
              description: '`true` from the floor of rated markets and events.'
            floor:
              type: object
              additionalProperties: false
              required: [markets, events]
              description: The least a wallet needs to be rated.
              properties:
                markets:
                  type: integer
                  description: The rated markets needed, 30.
                events:
                  type: integer
                  description: The distinct events needed, 3.
            horizon_hours:
              type: integer
              description: How long before resolution the forecast is taken, 12.
            markets:
              type: integer
              minimum: 0
              description: The wallet's rated markets, shown also below the floor.
            events:
              type: integer
              minimum: 0
              description: The distinct events of those markets, shown also below the floor.
            brier:
              type: [number, "null"]
              description: The mean squared gap between forecast and outcome, from 0 to 1, where lower is better. `null` below the floor.
            edge:
              type: [number, "null"]
              description: The mean of outcome minus forecast. Above 0 means the backed outcomes came true more often than the prices paid implied. `null` below the floor.
            edge_se:
              type: [number, "null"]
              minimum: 0
              description: The standard error of `edge`. `null` below the floor.
            calibration:
              type: array
              description: Five buckets of width 0.2 on the forecast, in order. Empty below the floor.
              items: {$ref: '#/components/schemas/WalletBucket'}
        wash:
          type: object
          additionalProperties: false
          required: [scored, score, paired_volume, flagged_volume, flagged_share, algorithm, evidence]
          description: The wash-trading check.
          properties:
            scored:
              type: boolean
              description: '`false` for a wallet with no trade against another wallet, which then has no score.'
            score:
              type: [number, "null"]
              minimum: 0
              maximum: 1
              description: How strongly the wallet's trading fits the wash pattern, from 0 to 1, after it has been mixed with the scores of its counterparties. `null` when `scored` is `false`.
            paired_volume:
              description: The shares the wallet traded against other wallets, on both sides of its fills.
              $ref: '#/components/schemas/Amount'
            flagged_volume:
              description: The part of `paired_volume` in trades that were flagged.
              $ref: '#/components/schemas/Amount'
            flagged_share:
              description: '`flagged_volume` divided by `paired_volume`, and 0 when nothing was paired.'
              $ref: '#/components/schemas/Ratio'
            algorithm:
              type: string
              enum: [columbia-2]
              description: The method that flagged the trades, the second algorithm of the Columbia method.
            evidence:
              type: object
              additionalProperties: false
              required: [counterparties, trades]
              description: What lies behind the flag. Both lists are empty for a wallet that is not flagged.
              properties:
                counterparties:
                  type: array
                  maxItems: 5
                  description: The top 5 counterparties by flagged shares.
                  items: {$ref: '#/components/schemas/WashCounterparty'}
                trades:
                  type: array
                  maxItems: 20
                  description: The top 20 flagged trades by shares. Ties go to the earlier trade.
                  items: {$ref: '#/components/schemas/WashTrade'}
        coverage: {$ref: '#/components/schemas/Coverage'}
    WalletBucket:
      description: One bucket of a wallet's calibration curve.
      type: object
      additionalProperties: false
      required: [lo, hi, markets, mean_forecast, observed]
      properties:
        lo:
          type: number
          description: The lower end of the forecast range of the bucket.
        hi:
          type: number
          description: The upper end of the forecast range of the bucket. The last bucket includes 1.
        markets:
          type: integer
          minimum: 0
          description: The rated markets whose forecast fell in the range.
        mean_forecast:
          type: number
          description: The mean forecast of those markets. 0 when there are none.
        observed:
          type: number
          description: The mean outcome of those markets, the share that came true. 0 when there are none.
    WashCounterparty:
      description: A wallet that the flagged trades were made against.
      type: object
      additionalProperties: false
      required: [wallet, score, markets, trades, shares]
      properties:
        wallet:
          description: The counterparty, in lowercase.
          $ref: '#/components/schemas/Address'
        score:
          type: number
          minimum: 0
          maximum: 1
          description: The wash score of the counterparty.
        markets:
          type: integer
          minimum: 1
          description: The markets in which the two wallets made flagged trades.
        trades:
          type: integer
          minimum: 1
          description: The number of flagged trades between the two wallets.
        shares:
          description: The flagged shares between the two wallets.
          $ref: '#/components/schemas/Amount'
    WashTrade:
      description: One flagged trade, seen from the side of the wallet in question.
      type: object
      additionalProperties: false
      required: [id, time, market, counterparty, side, outcome, shares, usdc, price]
      properties:
        id:
          type: string
          pattern: '^137_[0-9]+_[0-9]+$'
          description: The trade id, `137_<block>_<logIndex>`, so the trade can be found on chain.
          examples: ["137_71578356_678"]
        time:
          description: When the trade happened.
          $ref: '#/components/schemas/Time'
        market:
          type: object
          additionalProperties: false
          required: [condition, question]
          description: The market of the trade.
          properties:
            condition:
              description: The condition id of the market.
              $ref: '#/components/schemas/Hash32'
            question:
              type: [string, "null"]
              description: The question of the market, and `null` when its text is missing.
        counterparty:
          description: The other wallet of the trade, in lowercase.
          $ref: '#/components/schemas/Address'
        side:
          type: string
          enum: [buy, sell]
          description: What the wallet in question did, bought or sold.
        outcome:
          type: integer
          enum: [0, 1]
          description: The outcome of the market that changed hands, 0 or 1.
        shares:
          description: The number of shares traded.
          $ref: '#/components/schemas/Amount'
        usdc:
          description: The USDC paid for them.
          $ref: '#/components/schemas/Amount'
        price:
          type: number
          minimum: 0
          description: The price per share in USDC, `usdc` divided by `shares`.
    PmLeaderboard:
      description: One page of a leaderboard.
      type: object
      additionalProperties: false
      required: [kind, board, limit, offset, total, rows, coverage]
      properties:
        kind:
          type: string
          enum: [pm_leaderboard]
          description: Always `pm_leaderboard`. It names the shape of this object.
        board:
          type: string
          enum: [pnl, volume, skill]
          description: Which board this page is from.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: The page size that was used.
        offset:
          type: integer
          minimum: 0
          maximum: 10000
          description: The number of rows that were skipped.
        total:
          type: integer
          minimum: 0
          description: The number of wallets on the board, all wallets for `pnl` and `volume` and the rated wallets for `skill`.
        rows:
          type: array
          description: The rows of the page, in rank order. Empty past the end of the board.
          items: {$ref: '#/components/schemas/LeaderboardRow'}
        coverage: {$ref: '#/components/schemas/Coverage'}
    LeaderboardRow:
      description: One wallet on a leaderboard.
      type: object
      additionalProperties: false
      required: [rank, wallet, fills, markets, volume, realized, final, wash_share, skill]
      properties:
        rank:
          type: integer
          minimum: 1
          description: The position on the board, counted from 1. It is `offset` plus the position in the page.
        wallet:
          description: The wallet, in lowercase.
          $ref: '#/components/schemas/Address'
        fills:
          type: integer
          minimum: 1
          description: The number of the wallet's own fills.
        markets:
          type: integer
          minimum: 0
          description: The markets in which the wallet has any event.
        volume:
          description: The value of its fills in USDC.
          $ref: '#/components/schemas/Amount'
        realized:
          description: The net result in USDC, as in the trader record.
          $ref: '#/components/schemas/Amount'
        final:
          type: boolean
          description: '`true` when the wallet has no open unresolved position.'
        wash_share:
          description: The flagged part of the shares the wallet traded against other wallets, and 0 when it has none.
          $ref: '#/components/schemas/Ratio'
        skill:
          description: The skill figures of a rated wallet, and `null` for a wallet that is not rated.
          oneOf:
            - $ref: '#/components/schemas/BoardSkill'
            - type: "null"
    BoardSkill:
      description: The skill figures of a rated wallet.
      type: object
      additionalProperties: false
      required: [markets, events, brier, edge, edge_lb]
      properties:
        markets:
          type: integer
          minimum: 30
          description: The rated markets.
        events:
          type: integer
          minimum: 3
          description: The distinct events of those markets.
        brier:
          type: number
          description: The mean squared gap between forecast and outcome, where lower is better.
        edge:
          type: number
          description: The mean of outcome minus forecast.
        edge_lb:
          type: number
          description: '`edge` minus 1.96 standard errors, the 95% lower bound. The skill board ranks on it, and it can be negative.'
    PmCalibration:
      description: How well market prices predicted outcomes.
      type: object
      additionalProperties: false
      required: [kind, horizon_hours, market_kind, markets, brier, buckets, excluded, coverage]
      properties:
        kind:
          type: string
          enum: [pm_calibration]
          description: Always `pm_calibration`. It names the shape of this object.
        horizon_hours:
          type: integer
          enum: [4, 12, 24, 168]
          description: How long before resolution the price is taken, in hours.
        market_kind:
          type: string
          enum: [other, updown, unknown, all]
          description: Which markets were counted.
        markets:
          type: integer
          minimum: 0
          description: The markets counted, which is the sum over the buckets.
        brier:
          type: [number, "null"]
          description: The mean squared gap between price and outcome, where lower is better. `null` when no market was counted.
        buckets:
          type: array
          description: Twenty buckets of width 0.05 on the price, in order.
          items: {$ref: '#/components/schemas/PriceBucket'}
        excluded:
          type: object
          additionalProperties: false
          required: [no_price]
          description: What was left out.
          properties:
            no_price:
              type: integer
              minimum: 0
              description: The resolved markets of the chosen kind that have no price, because nothing traded before the horizon or the resolution time is unknown.
        coverage: {$ref: '#/components/schemas/Coverage'}
    PriceBucket:
      description: One bucket of the calibration table.
      type: object
      additionalProperties: false
      required: [lo, hi, markets, mean_price, observed]
      properties:
        lo:
          type: number
          description: The lower end of the price range of the bucket.
        hi:
          type: number
          description: The upper end of the price range of the bucket. The last bucket includes 1.
        markets:
          type: integer
          minimum: 0
          description: The markets whose price fell in the range.
        mean_price:
          type: number
          description: The mean price of those markets. 0 when there are none.
        observed:
          type: number
          description: The mean outcome of those markets, the share that came true, with a 50-50 resolution counted as one half. 0 when there are none.
    PmTopMarkets:
      description: The events with the most trading in the last 24 hours, from the live feed.
      type: object
      additionalProperties: false
      required: [kind, items, fetched_at, stale, source]
      properties:
        kind:
          type: string
          enum: [pm_top_markets]
          description: Always `pm_top_markets`. It names the shape of this object.
        items:
          type: array
          description: The events in order of 24-hour volume, highest first.
          items: {$ref: '#/components/schemas/TopEvent'}
        fetched_at:
          $ref: '#/components/schemas/Time'
        stale:
          type: boolean
          description: "`true` when the last poll failed and this is the last good copy."
        source:
          type: string
          enum: [polymarket-gamma]
          description: Where the data comes from.
    TopEvent:
      type: object
      additionalProperties: false
      required: [event_id, slug, title, volume_24h_usd, volume_total_usd, liquidity_usd, end_date, markets]
      properties:
        event_id:
          type: string
          description: Polymarket's id of the event.
        slug:
          type: string
          description: The event's slug, which is the last part of its Polymarket page address.
        title:
          type: string
          description: The event's title.
        volume_24h_usd:
          type: number
          minimum: 0
          description: The dollars traded in the event in the last 24 hours, as a plain JSON number.
        volume_total_usd:
          type: [number, "null"]
          minimum: 0
          description: The dollars traded in the event since it opened, as a plain JSON number, or `null` when Polymarket sends none.
        liquidity_usd:
          type: number
          minimum: 0
          description: The dollars resting in the event's order books, as a plain JSON number.
        end_date:
          type: [string, "null"]
          description: When the event ends, as Polymarket writes it in RFC 3339, or `null` when it has no end date.
        markets:
          type: array
          description: The event's open markets, at most 10, in the order Polymarket lists them.
          items: {$ref: '#/components/schemas/TopMarket'}
    TopMarket:
      type: object
      additionalProperties: false
      required: [question, outcome_prices]
      properties:
        question:
          type: string
          description: The question the market asks.
        outcome_prices:
          type: array
          description: The current price of each outcome in order, each from 0 to 1. Empty when Polymarket's price list could not be read.
          items: {type: number, minimum: 0, maximum: 1}
    PmLargeTrades:
      description: Recent large trades, from the live feed.
      type: object
      additionalProperties: false
      required: [kind, items, fetched_at, stale, source]
      properties:
        kind:
          type: string
          enum: [pm_large_trades]
          description: Always `pm_large_trades`. It names the shape of this object.
        items:
          type: array
          description: The trades, newest first.
          items: {$ref: '#/components/schemas/LargeTrade'}
        fetched_at:
          $ref: '#/components/schemas/Time'
        stale:
          type: boolean
          description: "`true` when the last poll failed and this is the last good copy."
        source:
          type: string
          enum: [polymarket-data]
          description: Where the data comes from.
    LargeTrade:
      type: object
      additionalProperties: false
      required: [tx, time, wallet, question, side, outcome, size, price, usd]
      properties:
        tx:
          type: string
          description: The hash of the transaction that carried the trade. Several fills can share one.
        time:
          $ref: '#/components/schemas/Time'
        wallet:
          type: string
          description: Polymarket's proxy wallet that traded, as the Data API writes it.
        question:
          type: string
          description: The question of the market that was traded.
        side:
          type: string
          description: "`BUY` or `SELL`, from the point of view of the wallet."
        outcome:
          type: string
          description: The outcome that was bought or sold, such as `Yes`.
        size:
          type: number
          minimum: 0
          description: The number of shares, as a plain JSON number.
        price:
          type: number
          minimum: 0
          description: The price of one share in dollars, from 0 to 1.
        usd:
          type: number
          minimum: 0
          description: "`size` times `price` in dollars, rounded to cents."
    VenueCoverage:
      description: What a recorded venue holds, from when, and how complete it is. It replaces the Polymarket `coverage` on venue answers.
      type: object
      additionalProperties: false
      required: [venue, since, last_ok, mode, wallets, gaps, note]
      properties:
        venue:
          type: string
          enum: [kalshi, polymarket-us, hyperliquid, levr]
          description: The venue this describes.
        since:
          description: When recording of this venue started. There is no earlier data.
          $ref: '#/components/schemas/Time'
        last_ok:
          description: When the last collector job of this venue worked, or `null` if none has yet.
          oneOf:
            - $ref: '#/components/schemas/Time'
            - type: "null"
        mode:
          type: string
          enum: [recorded, snapshot_only, partial_tape, no_wallets]
          description: '`recorded` is a full tape with wallets. `partial_tape` is snapshots plus only the trades above a size floor. `snapshot_only` is snapshots and no trades. `no_wallets` is a tape without trader ids.'
        wallets:
          type: boolean
          description: '`true` when the venue has trader ids, so it has a trader route and leaderboards.'
        gaps:
          type: [integer, "null"]
          minimum: 0
          description: How many times the collector knows it missed trades since recording started, or `null` for a venue that has no trade tape.
        note:
          type: string
          description: The limits of this record in a sentence.
    PmVenues:
      description: The venues the service knows.
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [pm_venues]
          description: Always `pm_venues`. It names the shape of this object.
        items:
          type: array
          description: Polymarket first, then the recorded venues in code order.
          items: {$ref: '#/components/schemas/VenueItem'}
    VenueItem:
      type: object
      additionalProperties: false
      required: [code, name, quote, wallets, since, last_ok, mode, note]
      properties:
        code:
          type: string
          enum: [polymarket, hyperliquid, kalshi, levr, polymarket-us]
          description: The value to pass as `venue`.
        name:
          type: string
          description: The venue's name.
        quote:
          type: string
          enum: [USDC, USD]
          description: The currency its prices and amounts are in.
        wallets:
          type: boolean
          description: '`true` when the venue has trader ids.'
        since:
          description: When the record starts.
          $ref: '#/components/schemas/Time'
        last_ok:
          description: When the venue was last read successfully, or `null` if it has not been.
          oneOf:
            - $ref: '#/components/schemas/Time'
            - type: "null"
        mode:
          type: string
          enum: [history_and_live, recorded, snapshot_only, partial_tape, no_wallets]
          description: What kind of record it is. See the route description.
        note:
          type: string
          description: The limits of the record in a sentence.
    PmVenueTopMarkets:
      description: The most active markets of a recorded venue.
      type: object
      additionalProperties: false
      required: [kind, venue, items, as_of, source, coverage]
      properties:
        kind:
          type: string
          enum: [pm_top_markets]
          description: Always `pm_top_markets`. It names the shape of this object.
        venue:
          type: string
          enum: [kalshi, polymarket-us, hyperliquid]
          description: The venue of the markets.
        items:
          type: array
          description: The markets in order of 24-hour volume, highest first (total volume for `polymarket-us`).
          items: {$ref: '#/components/schemas/VenueMarket'}
        as_of:
          description: The time of the newest snapshot among the items, or `null` when the list is empty.
          oneOf:
            - $ref: '#/components/schemas/Time'
            - type: "null"
        source:
          $ref: '#/components/schemas/VenueSource'
        coverage: {$ref: '#/components/schemas/VenueCoverage'}
    VenueSource:
      type: string
      enum: [kalshi-api, polymarket-us-gateway, hyperliquid-info, levr-squid]
      description: Where the collector reads the venue's data.
    VenueMarket:
      type: object
      additionalProperties: false
      required: [market_id, title, market_kind, status, result, close_time, yes_price, volume_usd, open_interest_usd, volume_24h_usd, as_of]
      properties:
        market_id:
          type: string
          description: The venue's id of the market.
        title:
          type: string
          description: The market's title as the venue words it.
        market_kind:
          type: string
          description: The venue's own category of the market, such as a Kalshi series or a HIP-4 outcome type. It can be empty.
        status:
          type: string
          description: The venue's state of the market, such as `open`, `closed` or `resolved`.
        result:
          type: [string, "null"]
          description: The settled result when the venue has one, such as `yes`, `no` or a fraction, and `null` before.
        close_time:
          description: When the market closes, or `null` when the venue gives none.
          oneOf:
            - $ref: '#/components/schemas/Time'
            - type: "null"
        yes_price:
          description: The latest Yes price, from 0 to 1.
          $ref: '#/components/schemas/Ratio'
        volume_usd:
          type: [number, "null"]
          minimum: 0
          description: The total traded, in dollars as a plain JSON number, or `null` when the venue does not report it.
        open_interest_usd:
          type: [number, "null"]
          minimum: 0
          description: The open interest in dollars, or `null` when the venue does not report it.
        volume_24h_usd:
          type: [number, "null"]
          minimum: 0
          description: The dollars traded in the last 24 hours, or `null` when the venue does not report it.
        as_of:
          description: The time of the snapshot or trade that these figures come from.
          $ref: '#/components/schemas/Time'
    PmVenueLargeTrades:
      description: The newest large trades of a recorded venue.
      type: object
      additionalProperties: false
      required: [kind, venue, min_usd, items, source, coverage]
      properties:
        kind:
          type: string
          enum: [pm_large_trades]
          description: Always `pm_large_trades`. It names the shape of this object.
        venue:
          type: string
          enum: [kalshi, hyperliquid]
          description: The venue of the trades.
        min_usd:
          type: number
          description: The floor of this list in US dollars, the asked `min_usd` or the venue's default, 10000 on Kalshi and 1000 on Hyperliquid.
        items:
          type: array
          description: The trades, newest first, which may be empty.
          items: {$ref: '#/components/schemas/VenueTrade'}
        source:
          $ref: '#/components/schemas/VenueSource'
        coverage: {$ref: '#/components/schemas/VenueCoverage'}
    VenueTrade:
      type: object
      additionalProperties: false
      required: [id, time, market_id, question, side, wallet, size, yes_price, usd]
      properties:
        id:
          type: string
          description: The venue's id of the trade.
        time:
          $ref: '#/components/schemas/Time'
        market_id:
          type: string
          description: The id of the market, as in the top markets route.
        question:
          type: string
          description: The market's title, or empty when the market is not recorded.
        side:
          type: string
          description: What the taker did. For Kalshi it is `yes` or `no`, the side the taker paid for. For Hyperliquid it is `buy` or `sell` of the Yes coin.
        wallet:
          description: The taker's wallet for Hyperliquid, and `null` for Kalshi, which publishes no trader ids.
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: "null"
        size:
          type: number
          minimum: 0
          description: The contracts or shares traded, as a plain JSON number.
        yes_price:
          description: The Yes price of the trade, from 0 to 1.
          $ref: '#/components/schemas/Ratio'
        usd:
          type: number
          minimum: 0
          description: What the taker paid, in dollars as a plain JSON number.
    PmMarketHistory:
      description: The recorded history of one market.
      type: object
      additionalProperties: false
      required: [kind, venue, market, items, source, coverage]
      properties:
        kind:
          type: string
          enum: [pm_market_history]
          description: Always `pm_market_history`. It names the shape of this object.
        venue:
          type: string
          enum: [kalshi, polymarket-us, hyperliquid]
          description: The venue of the market.
        market:
          type: object
          additionalProperties: false
          required: [id, title, market_kind, status, result, close_time]
          description: What the venue says about the market.
          properties:
            id: {type: string, description: "The venue's id of the market."}
            title: {type: string, description: "The market's title."}
            market_kind: {type: string, description: "The venue's own category of the market."}
            status: {type: string, description: "The venue's state of the market."}
            result: {type: [string, "null"], description: "The settled result, or `null` before."}
            close_time:
              description: When the market closes, or `null`.
              oneOf:
                - $ref: '#/components/schemas/Time'
                - type: "null"
        items:
          type: array
          description: The points of the window, oldest first.
          items: {$ref: '#/components/schemas/VenuePoint'}
        source:
          $ref: '#/components/schemas/VenueSource'
        coverage: {$ref: '#/components/schemas/VenueCoverage'}
    VenuePoint:
      type: object
      additionalProperties: false
      required: [time, yes_price, volume_usd, open_interest_usd, volume_24h_usd]
      properties:
        time:
          description: When the snapshot was taken, or the start of the 5 minute bucket for Hyperliquid.
          $ref: '#/components/schemas/Time'
        yes_price:
          description: The Yes price, from 0 to 1.
          $ref: '#/components/schemas/Ratio'
        volume_usd:
          type: [number, "null"]
          minimum: 0
          description: The total traded in dollars, or `null` when the venue does not report it.
        open_interest_usd:
          type: [number, "null"]
          minimum: 0
          description: The open interest in dollars, or `null`.
        volume_24h_usd:
          type: [number, "null"]
          minimum: 0
          description: The dollars traded in the last 24 hours, or `null`.
    WinRate:
      type: object
      additionalProperties: false
      required: [value, wilson_lower, shown, floor]
      description: The share of resolved markets that were won, shown only from the floor, as in the Polymarket trader record.
      properties:
        value: {type: [number, "null"], minimum: 0, maximum: 1, description: '`won_markets` divided by `resolved_markets`, to 4 decimals, and `null` below the floor.'}
        wilson_lower: {type: [number, "null"], minimum: 0, maximum: 1, description: "The lower bound of the 95% Wilson interval of `value`, and `null` below the floor."}
        shown: {type: boolean, description: '`true` from the floor of resolved markets.'}
        floor: {type: integer, description: "The number of resolved markets from which it is shown, 30."}
    PmHyperliquidTrader:
      description: The record of one Hyperliquid HIP-4 wallet, in the shape of the Polymarket trader record without the owner, wash and calibration parts.
      type: object
      additionalProperties: false
      required: [kind, venue, wallet, activity, pnl, skill, coverage]
      properties:
        kind:
          type: string
          enum: [pm_trader]
          description: Always `pm_trader`. It names the shape of this object.
        venue:
          type: string
          enum: [hyperliquid]
          description: Always `hyperliquid`.
        wallet:
          description: The wallet, in lowercase.
          $ref: '#/components/schemas/Address'
        activity:
          type: object
          additionalProperties: false
          required: [fills, markets, volume]
          description: What the wallet traded, on its own side so that nothing is counted twice.
          properties:
            fills: {type: integer, minimum: 1, description: "The number of the wallet's own fills."}
            markets: {type: integer, minimum: 1, description: "The outcomes it traded."}
            volume: {description: "The value of its fills in USDC.", $ref: '#/components/schemas/Amount'}
        pnl:
          type: object
          additionalProperties: false
          required: [realized, gross, fees, resolved_markets, won_markets, win_rate]
          description: Profit and loss from the recorded tape only, counted like the Polymarket record, with fills netted by outcome and settled at the venue's payout.
          properties:
            realized: {description: "Gross minus fees in USDC.", $ref: '#/components/schemas/Amount'}
            gross: {description: "The realized profit before fees, with settled outcomes valued at their payout.", $ref: '#/components/schemas/Amount'}
            fees: {description: "Fees paid. They are 0 because the tape carries none.", $ref: '#/components/schemas/Amount'}
            resolved_markets: {type: integer, minimum: 0, description: "The outcomes it traded that have settled."}
            won_markets: {type: integer, minimum: 0, description: "The settled outcomes with a profit."}
            win_rate: {$ref: '#/components/schemas/WinRate'}
        skill:
          type: object
          additionalProperties: false
          required: [rated, floor, brier, edge, edge_se]
          description: Forecasting skill over question-type outcomes only (sports, awards, policy rates and IPOs). Recurring price outcomes are not rated.
          properties:
            rated: {type: boolean, description: '`true` from the floor of rated outcomes.'}
            floor:
              type: object
              additionalProperties: false
              required: [markets, events]
              description: The rating floor, where each outcome counts as its own event.
              properties:
                markets: {type: integer, description: "The rated outcomes needed."}
                events: {type: integer, description: "The events needed."}
            brier: {type: [number, "null"], description: "The mean squared gap between forecast and outcome, and `null` below the floor."}
            edge: {type: [number, "null"], description: "The mean of outcome minus forecast, and `null` below the floor."}
            edge_se: {type: [number, "null"], description: "The standard error of the edge, and `null` below the floor."}
        coverage: {$ref: '#/components/schemas/VenueCoverage'}
    PmLevrTrader:
      description: The leveraged positions of one Levr Bet wallet.
      type: object
      additionalProperties: false
      required: [kind, venue, wallet, positions, open, won, lost, liquidated, voided, stake, size, leverage, liquidation_rate, win_rate, realized, first_position, last_position, coverage]
      properties:
        kind:
          type: string
          enum: [pm_levr_trader]
          description: Always `pm_levr_trader`. It names the shape of this object.
        venue:
          type: string
          enum: [levr]
          description: Always `levr`.
        wallet:
          description: The wallet, in lowercase.
          $ref: '#/components/schemas/Address'
        positions: {type: integer, minimum: 1, description: "The positions it opened since recording started."}
        open: {type: integer, minimum: 0, description: "The positions not yet closed."}
        won: {type: integer, minimum: 0, description: "The positions redeemed with a profit."}
        lost: {type: integer, minimum: 0, description: "The positions that ended with less than the stake, including those lost when their game settled."}
        liquidated: {type: integer, minimum: 0, description: "The positions the venue liquidated, each of which loses the whole stake."}
        voided: {type: integer, minimum: 0, description: "The positions of cancelled games. The refund is not published, so their result is counted as 0."}
        stake: {description: "The USDC put up across all positions.", $ref: '#/components/schemas/Amount'}
        size: {description: "The notional size of all positions in USDC.", $ref: '#/components/schemas/Amount'}
        leverage: {type: number, minimum: 0, description: "Size divided by stake across all positions, to 4 decimals."}
        liquidation_rate: {description: "Liquidated positions over positions that ended in a win, a loss or a liquidation.", $ref: '#/components/schemas/Ratio'}
        win_rate: {description: "Won positions over positions that ended in a win, a loss or a liquidation.", $ref: '#/components/schemas/Ratio'}
        realized: {description: "Payout minus stake over the closed positions, where a liquidation loses the whole stake. A position still open adds nothing.", $ref: '#/components/schemas/Amount'}
        first_position: {description: "When its first position opened.", $ref: '#/components/schemas/Time'}
        last_position: {description: "When its last position opened.", $ref: '#/components/schemas/Time'}
        coverage: {$ref: '#/components/schemas/VenueCoverage'}
    PmHyperliquidBoard:
      description: One page of a Hyperliquid HIP-4 leaderboard.
      type: object
      additionalProperties: false
      required: [kind, venue, board, limit, offset, total, rows, coverage]
      properties:
        kind:
          type: string
          enum: [pm_leaderboard]
          description: Always `pm_leaderboard`. It names the shape of this object.
        venue:
          type: string
          enum: [hyperliquid]
          description: Always `hyperliquid`.
        board:
          type: string
          enum: [pnl, volume, skill]
          description: Which board this page is from.
        limit: {type: integer, minimum: 1, maximum: 100, description: "The page size that was used."}
        offset: {type: integer, minimum: 0, maximum: 10000, description: "The number of rows that were skipped."}
        total: {type: integer, minimum: 0, description: "The wallets on the board, all wallets for `pnl` and `volume` and the rated ones for `skill`."}
        rows:
          type: array
          description: The rows of the page in rank order, empty past the end of the board.
          items: {$ref: '#/components/schemas/HyperliquidBoardRow'}
        coverage: {$ref: '#/components/schemas/VenueCoverage'}
    HyperliquidBoardRow:
      type: object
      additionalProperties: false
      required: [rank, wallet, fills, markets, volume, realized, skill]
      properties:
        rank: {type: integer, minimum: 1, description: "The position on the board, counted from 1."}
        wallet: {description: "The wallet, in lowercase.", $ref: '#/components/schemas/Address'}
        fills: {type: integer, minimum: 1, description: "The number of the wallet's own fills."}
        markets: {type: integer, minimum: 0, description: "The outcomes it traded."}
        volume: {description: "The value of its fills in USDC.", $ref: '#/components/schemas/Amount'}
        realized: {description: "The realized profit in USDC, as in the trader record.", $ref: '#/components/schemas/Amount'}
        skill:
          description: The skill figures of a rated wallet, and `null` for one that is not rated.
          oneOf:
            - type: object
              additionalProperties: false
              required: [brier, edge, edge_lb]
              properties:
                brier: {type: number, description: "The mean squared gap between forecast and outcome."}
                edge: {type: number, description: "The mean of outcome minus forecast."}
                edge_lb: {type: number, description: '`edge` minus 1.96 standard errors. The skill board ranks on it.'}
            - type: "null"
    PmLevrBoard:
      description: One page of a Levr Bet leaderboard.
      type: object
      additionalProperties: false
      required: [kind, venue, board, limit, offset, total, rows, coverage]
      properties:
        kind:
          type: string
          enum: [pm_leaderboard]
          description: Always `pm_leaderboard`. It names the shape of this object.
        venue:
          type: string
          enum: [levr]
          description: Always `levr`.
        board:
          type: string
          enum: [pnl, volume]
          description: Which board this page is from. `pnl` ranks realized profit and `volume` ranks the size of the positions opened.
        limit: {type: integer, minimum: 1, maximum: 100, description: "The page size that was used."}
        offset: {type: integer, minimum: 0, maximum: 10000, description: "The number of rows that were skipped."}
        total: {type: integer, minimum: 0, description: "The wallets on the board."}
        rows:
          type: array
          description: The rows of the page in rank order, empty past the end of the board.
          items: {$ref: '#/components/schemas/LevrBoardRow'}
        coverage: {$ref: '#/components/schemas/VenueCoverage'}
    LevrBoardRow:
      type: object
      additionalProperties: false
      required: [rank, wallet, positions, stake, size, leverage, liquidations, liquidation_rate, win_rate, realized]
      properties:
        rank: {type: integer, minimum: 1, description: "The position on the board, counted from 1."}
        wallet: {description: "The wallet, in lowercase.", $ref: '#/components/schemas/Address'}
        positions: {type: integer, minimum: 1, description: "The positions it opened."}
        stake: {description: "The USDC put up across all positions.", $ref: '#/components/schemas/Amount'}
        size: {description: "The notional size of all positions in USDC.", $ref: '#/components/schemas/Amount'}
        leverage: {type: number, minimum: 0, description: "Size divided by stake, to 4 decimals."}
        liquidations: {type: integer, minimum: 0, description: "The positions the venue liquidated."}
        liquidation_rate: {description: "Liquidated positions over positions that ended in a win, a loss or a liquidation.", $ref: '#/components/schemas/Ratio'}
        win_rate: {description: "Won positions over positions that ended in a win, a loss or a liquidation.", $ref: '#/components/schemas/Ratio'}
        realized: {description: "Payout minus stake over the closed positions.", $ref: '#/components/schemas/Amount'}
