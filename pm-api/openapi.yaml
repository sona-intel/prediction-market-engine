  /internal/v1/leaderboards/{board}:
    get:
      operationId: getLeaderboard
      tags: [Leaderboards]
      summary: Get a page of a leaderboard
      description: |
        Call this to list wallets in rank order. There are three boards:

        - `pnl` ranks every wallet by net profit, `gross` minus `fees` over its whole life, highest first. A wallet with open positions is ranked on its result so far, and its `final` is `false`.
        - `volume` ranks every wallet by its volume in USDC, counted once, highest first.
        - `skill` ranks only rated wallets (30 rated markets in at least 3 events) by `edge_lb`, the edge minus 1.96 standard errors, highest first. It ranks on the lower bound and not on Brier, because a wallet that only trades at 0.99 has a tiny Brier and no edge. `edge_lb` can be negative. The board is short: most wallets are never rated.

        Ties break on volume, highest first, and then on an internal wallet number, so the order is the same on every call and pages never overlap. Wallets without a fill are not on any board.

        `limit` is the page size, 1 to 100, 50 by default. `offset` is how many rows to skip, 0 to 10000, 0 by default. `rank` is the position on the board, counted from 1, so the first row of a page has the rank `offset + 1`. `total` is the number of wallets on the board: all wallets for `pnl` and `volume`, and the rated wallets for `skill`. A page past the end is not an error. It has an empty `rows` array and the right `total`.

        A row has the wallet, its `fills`, `markets`, `volume` and net `realized` profit (the same figures as in the trader record), `final`, the `wash_share` (the flagged part of the shares it traded against other wallets, 0 when it has none) and `skill`. `skill` is `null` for a wallet that is not rated and otherwise holds `markets`, `events`, `brier`, `edge` and `edge_lb`. Read the rules behind these figures in the trader route. Pull the full record of a row with the trader route.

        **Other venues.** With `venue=hyperliquid` the boards are `pnl`, `volume` and `skill` over the HIP-4 wallets, where `skill` ranks the rated wallets by `edge_lb`. With `venue=levr` the boards are `pnl` (realized profit) and `volume` (the size of the positions a wallet opened), and `skill` answers 400 `invalid_query`, because the board exists but Levr has none. The rows of those venues are different from the Polymarket rows, see `HyperliquidBoardRow` and `LevrBoardRow`, and a body carries `venue`. `kalshi` and `polymarket-us` have no trader ids and answer 400 `invalid_query`.

        Errors: 400 `invalid_id` for a `board` that is not `pnl`, `volume` or `skill`. 400 `invalid_query` for a `limit` or `offset` that is not a whole number in its range. 503 `upstream_unavailable` when no valid database exists yet, and 504 `deadline_exceeded` when the budget runs out.
      parameters:
        - $ref: '#/components/parameters/Venue'
        - $ref: '#/components/parameters/Board'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: The board exists. The body is one page of it.
          headers: *stampHeaders
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/PmLeaderboard'}, {$ref: '#/components/schemas/PmHyperliquidBoard'}, {$ref: '#/components/schemas/PmLevrBoard'}]}
