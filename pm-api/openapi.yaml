openapi: 3.1.2
info:
  title: Sona prediction-market service
  version: 1.0.0
  summary: Internal reads of Polymarket trader records, called only by sona-api.
  description: |
    This service answers questions about Polymarket traders. For one wallet it gives lifetime profit and loss, a skill rating with a calibration curve, and a wash-trading check with the trades behind any flag. It also serves three leaderboards and a market-wide calibration table. Its history routes read one finished database file and never call Polymarket or Hugging Face while they answer, so every history answer comes from the same closed snapshot. Two more routes serve a live feed of Polymarket's busiest markets and largest recent trades. That feed is kept in memory only and is refreshed once a minute, and it never touches the database file. The public `sona-api` is meant to call this service and to put its bodies inside its own answers. You call it directly to debug, or to see exactly what the public API will get.

    ## What the data covers

    The history runs from the first order-book trade on 2022-11-21 to **Polygon block 85,948,288, which is 2026-04-24 07:43:40 UTC**. Trades after that block are not included, and a market that resolved after it is still open here. Trades on Polymarket's old automated market maker are not part of profit and loss. The source is Envio's public Polymarket dataset (`moose-code/polymarket-onchain-v1`, licence CC BY 4.0), read at one pinned revision. Sona aggregated the source rows into per-wallet and per-market figures and is not affiliated with or endorsed by Polymarket or Envio.

    Every success body ends with a `coverage` object that repeats this: a plain-language `note`, the block and time the data goes through, the dataset `revision`, the `attribution` line, the `license_url`, the `modified` notice and the `source_url`. Anything you show to people must keep the attribution and the modified notice.

    The examples on this page are real answers of the small fixture database that this service is tested on. It is a sample of the dataset, so totals, ranks and wash scores in the examples are not full-history numbers.

    ## How to call it

    The service listens on `127.0.0.1:8191` on the host and on `http://pm-api:8080` inside the Docker network. The Swagger page shows this document but cannot send requests to the service, because the Swagger gateway has no route to it. Use a terminal:

    ```bash
    curl -s http://127.0.0.1:8191/internal/v1/status
    curl -s http://127.0.0.1:8191/internal/v1/traders/0x467ecfc0c6265683e90899C41881c0431bDEE2ed
    curl -s 'http://127.0.0.1:8191/internal/v1/leaderboards/skill?limit=10'
    curl -s 'http://127.0.0.1:8191/internal/v1/calibration?horizon=1d&market_kind=all'
    ```

    ## The live feed

    The history ends on 2026-04-24, so two routes sit next to it and show Polymarket as it is now. `GET /internal/v1/pm/markets/top` lists the events with the most trading in the last 24 hours, and `GET /internal/v1/pm/trades/large` lists recent trades of at least $10,000. A background poller reads Polymarket's public Gamma API (the top 50 active events by 24-hour volume) and Data API (the newest 200 trades of at least $10,000) once a minute, which is two requests a minute in total. The copies live in memory and are lost on restart. Nothing from them is written to the database file or mixed into the history tables.

    - Before the first poll has worked, both routes answer 503 `upstream_unavailable` with `retry_after_s` and `Retry-After` of 10.
    - When a later poll fails, the last good copy is kept and served with `stale: true` and the header `X-Sona-Cache: stale`. `fetched_at` still says when that copy was taken.
    - A live answer has no `coverage` object and no `Sona-Finality`, `Sona-Block` or `Sona-Block-Time` header, because it describes the present and not a block.
    - **Amounts in US dollars here are plain JSON numbers**, not the `raw` and `value` amount objects of the history routes. They come from a live feed that is not ledger data, so do not add them up as if they were exact.

    ## Time budget

    The request header `Sona-Deadline-Ms` is the most time, in milliseconds, that a call may take. It is 5000 when the header is absent or is not a whole number. When the budget runs out the answer is 504 `deadline_exceeded`, and a value of 0 or less answers 504 at once without reading anything. `sona-api` sends the time it has left minus a small margin.

    ## Response headers

    A successful history answer describes how far the data reaches in `Sona-*` headers. They are the same on every history route, because the history is one closed snapshot: `Sona-Finality` is always `finalized`, `Sona-Block` is `85948288` and `Sona-Block-Time` is `1777016620`, the Unix time of that block. The live routes send no `Sona-*` header. Every answer, including the two probes, also sends `X-Request-Id`, a random 16-digit hex id. Quote it when you report a problem: the service logs the cause of each 500 under that id.

    ## Errors

    Every error is `application/problem+json` (RFC 9457 problem details) with `Cache-Control: no-store`. A typical body:

    ```json
    {"type":"urn:sona:problem:invalid_id","title":"Invalid identifier","status":400,"detail":"The wallet must be 0x and 40 hex digits.","instance":"/internal/v1/traders/0x12","code":"invalid_id"}
    ```

    Branch on `code`, which is stable: `invalid_id` and `invalid_query` (400), `not_found` (404), `internal` (500), `upstream_unavailable` (503, always with `Retry-After: 1`) and `deadline_exceeded` (504). `instance` is the path of the request. A path or method that no route serves answers 404 `not_found` with the detail `No such route.`, so a `POST` gets 404 and not 405. A query parameter that this document does not name is ignored. If the caller disconnects before the answer is ready, the service counts the call as 499 and sends no body.

    The service answers 503 `upstream_unavailable` while no valid database file exists, for example before the first build has finished. It looks for a new or replaced file every 10 seconds and keeps serving the old file while a new one is checked, so a rebuild does not interrupt readers.

    ## Numbers and identifiers

    - An **amount** is an object with `raw`, `decimals`, `symbol` and `value`. `raw` is a signed whole number written as a string, in millionths of the unit. `decimals` is always 6. `symbol` is `USDC` for money in dollars and `shares` for outcome shares, and `value` is the same number as an exact decimal string without trailing zeros. A loss is negative.
    - A **ratio** such as `flagged_share` or `win_rate.value` is a plain JSON number from 0 to 1.
    - A **wallet** or other address is `0x` and 40 lowercase hex digits in answers. A request may use any case, and the service does not check the EIP-55 capitals.
    - A **time** is RFC 3339 in UTC, to whole seconds, ending in `Z`.
    - A **trade id** is `137_<block>_<logIndex>`: the Polygon chain id, the block number and the position of the log in the block, so the trade can be found on chain.

    ## Other venues

    Four more venues are recorded into Postgres by the collector `pm-collect` and read from there, never from a source API: Hyperliquid HIP-4 outcomes (`hyperliquid`), Kalshi (`kalshi`), Polymarket US (`polymarket-us`) and Levr Bet on Monad (`levr`). Recording started when the collector first ran, so there is no earlier history, and each venue's `coverage` object says what is and is not recorded. The routes for the busiest markets, the largest trades, one trader and the leaderboards take a `venue` query parameter whose default is `polymarket`, so a call without it answers exactly as before. `GET /internal/v1/pm/venues` lists the venues, and `GET /internal/v1/pm/markets/{venue}/{id}/history` serves the recorded snapshots of one market.

    - **What each venue has.** `hyperliquid` has the full fill tape with both wallets, so it has traders and leaderboards, and no market snapshots (its history route is the last trade price per 5 minutes). `kalshi` has market snapshots and only the prints that cost the taker at least $10,000, with no wallets. `polymarket-us` has market snapshots only. `levr` has leveraged positions per wallet, and no market list.
    - **Amounts.** Dollar amounts on the market, trade and history routes are plain JSON numbers, as on the live Polymarket routes. A field that a venue does not report is `null` and never 0. The trader and leaderboard routes keep the exact `raw` and `value` amounts. Prices are `yes_price` from 0 to 1, the price of the Yes side.
    - **No `Sona-*` stamp.** An answer for another venue has no `Sona-Finality`, `Sona-Block` or `Sona-Block-Time` header, because it describes a moving present and not one block. A venue answer has its own `coverage` object (see `VenueCoverage`) and not the Polymarket one.
    - **Errors.** An unknown `venue`, or a venue that a route cannot serve, answers 400 `invalid_query`. That includes a trader or leaderboard call for `kalshi` or `polymarket-us`, which publish no trader ids. When Postgres cannot be reached a venue route answers 503 `upstream_unavailable` with `Retry-After: 1`, while the Polymarket history and live routes keep answering.

    ## How this differs from the public API

    - The body is the bare record, with a `kind` and no `data`, `meta` and `links` envelope.
    - There are no credits, rate limits, payment headers or authentication. Access is limited by the network: the service listens only on the Docker network and on `127.0.0.1`.
    - There is no caching. Successful answers carry no `Cache-Control` or `ETag`, and `sona-api` is the layer that caches.
    - Only `GET` is used. A `HEAD` request is also answered, with the same headers and no body.
    - Nothing here trades, pays or acts for anyone. It only serves data.
servers:
  - url: http://127.0.0.1:8191
    description: pm-api on the host. Inside the Docker network it is http://pm-api:8080.
tags:
  - name: Status
    description: |
      Whether a database is loaded, when it was built, and how much it holds.
  - name: Traders
    description: |
      The full record of one wallet: activity, profit and loss, skill and wash-trading checks.
  - name: Leaderboards
    description: |
      Wallets ranked by net profit, by volume or by forecasting skill, in pages.
  - name: Calibration
    description: |
      How well market prices predicted outcomes, across all resolved markets.
  - name: Live
    description: |
      Polymarket's busiest markets and largest recent trades right now, kept in memory and refreshed once a minute.
  - name: Venues
    description: |
      The venues recorded beyond Polymarket, and the market snapshots, large trades, traders and leaderboards of each.
  - name: Operations
    description: |
      Probes for the container health check and for operators. They have no body.
paths:
  /internal/v1/status:
    get:
      operationId: getStatus
      tags: [Status]
      summary: Get the state of the loaded database
      description: |
        Call this to see whether the service holds a database, when that database was built, which rules built it and how much it contains. The body is `ready` (always `true` in an answer, because without a database the answer is 503), `built_at` (when the build published the file), `rules_version` (the version of the rules that computed every figure, which changes whenever a rule changes) and `totals`:

        - `fills` is the number of fills over all wallets. A match between two wallets is one fill for each of them, so it counts twice here, and the dataset's own trade count counts every match twice in the same way.
        - `wallets` is the number of wallets with at least one fill. These are the wallets that have a profile.
        - `rated_wallets` is the number of those that reached the skill floor of 30 rated markets in at least 3 events.
        - `markets` and `resolved_markets` are the markets in the database and the part of them that had resolved by the cutoff.

        The `coverage` object says what period the data covers. The totals and the coverage are read once when a database file is opened, so this call never touches the tables and is quick. A short `Sona-Deadline-Ms` only matters if it is 0 or less.

        Errors: 503 `upstream_unavailable` when no valid database exists yet, and 504 `deadline_exceeded` only when `Sona-Deadline-Ms` is 0 or less.
      parameters:
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: A database is loaded. The body is the status record.
          headers: &stampHeaders
            Sona-Finality: {$ref: '#/components/headers/SonaFinality'}
            Sona-Block: {$ref: '#/components/headers/SonaBlock'}
            Sona-Block-Time: {$ref: '#/components/headers/SonaBlockTime'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PmStatus'}
              examples:
                fixture:
                  summary: The fixture database
                  value: {"kind": "pm_status", "ready": true, "built_at": "2026-10-12T15:51:21.760Z", "rules_version": "pm-rules-1", "totals": {"fills": 45633, "wallets": 6847, "rated_wallets": 3, "markets": 3307, "resolved_markets": 3272}, "coverage": {"note": "Polymarket history through 2026-04-24 07:43:40 UTC (Polygon block 85,948,288). Order-book trades start on 2022-11-21. Later trades are not included. Trades on the old automated market maker are not part of profit and loss.", "through": {"block": 85948288, "time": "2026-04-24T07:43:40Z"}, "revision": "7eeb860dea5b79d5c74f3182b70bd08c85c8f833", "attribution": "Polymarket history: Envio, CC-BY-4.0", "license_url": "https://creativecommons.org/licenses/by/4.0/", "modified": "Modified by Sona: source rows were aggregated into per-wallet and per-market figures. Not affiliated with or endorsed by Polymarket or Envio.", "source_url": "https://huggingface.co/datasets/moose-code/polymarket-onchain-v1"}}
        "500":
          $ref: '#/components/responses/Internal'
          description: The service failed in a way it has no name for (`internal`). This route only reports numbers it read when the file was opened, so it should not happen. Report the `X-Request-Id`, because the service log holds the cause under that id.
        "503":
          $ref: '#/components/responses/Unavailable'
          description: No valid database file exists yet (`upstream_unavailable`). The first build has not finished, or the file is not a DuckDB database. Retry after the `Retry-After` of 1 s.
        "504":
          $ref: '#/components/responses/DeadlineExceeded'
          description: '`Sona-Deadline-Ms` was 0 or less. This route reads no table, so a positive budget never runs out.'
  /internal/v1/traders/{wallet}:
    get:
      operationId: getTrader
      tags: [Traders]
      summary: Get the full record of one wallet
      description: |
        Call this to see everything the service knows about one Polymarket wallet: what it traded, what it earned over its whole life, how good its forecasts were, and whether its trades look like wash trading. The `wallet` is `0x` and 40 hex digits in any case, such as `0x467ecfc0c6265683e90899C41881c0431bDEE2ed`. The address is the contract wallet that Polymarket trades through, a proxy contract or a Safe contract. When Polymarket's wallet registry lists it, `owner` is the account that controls it and `owner_kind` is `proxy` or `safe`. In a sample, about 90% of wallets were listed. Both are `null` for the others. Only wallets with at least one fill have a record.

        **Activity.** The figures count the wallet's own side of every trade, so a volume is counted once and never twice as in the raw dataset. `fills` is the number of its own fills and `volume` their value in USDC, with `buy_volume` the part that was buying. `taker_fills` and `taker_volume` are the part where the wallet's order was the one that took liquidity from the book. `markets` is the number of markets in which the wallet has any event: a fill, a split, a merge, a redemption or a conversion. `first_trade` and `last_trade` are the times of its first and last fill.

        **Profit and loss.** `pnl.realized` is the net result of the whole life of the wallet, `gross` minus `fees`, and it is computed like this:

        - Each token the wallet holds has an average cost. A buy raises the position and moves the average cost. A sell realizes the gap between the sell price and the average cost on the shares sold. A sell above the amount held is capped at what was held.
        - A split (one dollar turned into a share of each outcome) counts as buying both outcomes at 50 cents, and a merge as selling both at 50 cents. A neg-risk conversion follows the same average-cost rule.
        - When a market resolves, whatever the wallet still holds in it is sold at the payout: a dollar a share for the winning outcome, nothing for the losing one, 50 cents each for a 50-50 resolution. This settlement is what makes the result equal Polymarket's own realized figure.
        - The exchange charged fees from 2026-01-06 04:51:15 UTC. `fees` is what the wallet paid and is taken off. A fee taken in shares is valued at the wallet's average buy price in that market. Earlier fills have no fee.
        - A position in a market that had not resolved by the cutoff is not valued, because no mark price exists. It adds to `open_unresolved_positions` and `final` is `false`. Read such a `realized` as the result so far.
        - Trades on the old automated market maker are counted in `amm_trades_excluded` and are not in the result.

        `biggest_win` is the best net result in any single market, and it is 0 when that is $1.00 or less. `resolved_markets` is the number of its markets that had resolved and `won_markets` the part of them with net profit above 0. `win_rate` shows `value` and its lower bound at 95% confidence (`wilson_lower`) only from 30 resolved markets (`floor`), and `shown` says which. Below that both are `null`, because a ratio of a few markets says nothing.

        **Skill.** A market is rated for the wallet when it resolved, is an ordinary market (not an Up or Down market and not one whose question text is missing), and the wallet traded in it at least 12 hours before it resolved (`horizon_hours`). The wallet's forecast in that market is its last such trade, restated as a probability for the outcome it backed: a buy backs the outcome it bought at the price paid, and a sell backs the other outcome at one minus the price. Resolution time is the time of the first redemption in the market, which is a proxy. `brier` is the mean squared gap between forecast and outcome, where lower is better. `edge` is the mean of outcome minus forecast: above 0 means the outcomes it backed came true more often than the prices it paid implied. `edge_se` is the standard error of that mean. The wallet is `rated` from 30 rated markets in at least 3 events (`floor`), where an event is the neg-risk market, or the market itself when there is none. Several separate markets of one Polymarket event can count as several events. Below the floor `brier`, `edge` and `edge_se` are `null`, `calibration` is empty, and `markets` and `events` still show how far the wallet is from the floor. A rated wallet carries five calibration buckets of width 0.2 on the forecast, each with its market count, the mean forecast and the observed frequency of the outcome, with zeros in a bucket that holds no market.

        **Wash trading.** The check follows the method of a Columbia University paper on wash trading on Polymarket, called the Columbia method here. Two wallets that keep trading with each other and close their positions are suspicious. Every wallet gets a `score` from 0 to 1. It starts as the share of the wallet's volume in markets where it fully closed out a position, and it is then mixed with the scores of the wallets it trades against, so a wallet that mostly trades with closers scores high too. For each market the method then picks a threshold from the scores, and a trade is **flagged** when both wallets score at least that threshold. `paired_volume` is the shares the wallet traded against another wallet, `flagged_volume` the flagged part and `flagged_share` the ratio. A wallet is flagged when `flagged_volume` is above 0. `scored` is `false`, and `score` `null`, for a wallet with no paired trades. A score is a signal and not a verdict: it says the trading pattern fits, not who is behind it.

        `evidence` shows what lies behind a flag, and it is empty for a wallet that is not flagged. `counterparties` are the top 5 wallets by flagged shares and `trades` the top 20 flagged trades by shares (ties go to the earlier trade). The lists are cut to that length, but the totals above them are exact, and so are the figures inside the lists. A trade is seen from this wallet's side: `side` is what this wallet did, `outcome` is the market outcome 0 or 1 that changed hands, and `price` is `usdc` per share.

        **Other venues.** With `venue=hyperliquid` the record is a `pm_trader` with a `venue` field and the figures of the HIP-4 tape: activity, profit and loss and skill, and no wash check, owner or calibration. With `venue=levr` the record is a `pm_levr_trader` with the leveraged positions of the wallet. `kalshi` and `polymarket-us` publish no trader ids and answer 400 `invalid_query`. A wallet the venue has not recorded answers 404 `not_found`.

        Errors: 400 `invalid_id` for a wallet that is not `0x` and 40 hex digits. 404 `not_found` for a wallet with no fills, which includes one that only split, merged or redeemed. 503 `upstream_unavailable` when no valid database exists yet, and 504 `deadline_exceeded` when the budget runs out.
      parameters:
        - $ref: '#/components/parameters/Venue'
        - $ref: '#/components/parameters/Wallet'
        - $ref: '#/components/parameters/DeadlineMs'
      responses:
        "200":
          description: The wallet has a record. The body is the trader record.
          headers: *stampHeaders
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/PmTrader'}, {$ref: '#/components/schemas/PmHyperliquidTrader'}, {$ref: '#/components/schemas/PmLevrTrader'}]}
              examples:
                golden:
                  summary: A wallet with 11 resolved markets, so it has no win rate and no skill rating yet
                  value: {"kind": "pm_trader", "wallet": "0x467ecfc0c6265683e90899c41881c0431bdee2ed", "owner": "0x1ba177cdd00a459508ccdd88d5530202a2e202db", "owner_kind": "safe", "activity": {"fills": 290, "markets": 11, "volume": {"raw": "716582888996", "decimals": 6, "symbol": "USDC", "value": "716582.888996"}, "buy_volume": {"raw": "366611056390", "decimals": 6, "symbol": "USDC", "value": "366611.05639"}, "taker_fills": 23, "taker_volume": {"raw": "419332273059", "decimals": 6, "symbol": "USDC", "value": "419332.273059"}, "first_trade": "2025-07-09T04:21:12Z", "last_trade": "2025-07-20T16:04:51Z"}, "pnl": {"realized": {"raw": "-16628825094", "decimals": 6, "symbol": "USDC", "value": "-16628.825094"}, "gross": {"raw": "-16628825094", "decimals": 6, "symbol": "USDC", "value": "-16628.825094"}, "fees": {"raw": "0", "decimals": 6, "symbol": "USDC", "value": "0"}, "biggest_win": {"raw": "95527217758", "decimals": 6, "symbol": "USDC", "value": "95527.217758"}, "resolved_markets": 11, "won_markets": 4, "win_rate": {"value": null, "wilson_lower": null, "shown": false, "floor": 30}, "open_unresolved_positions": 0, "final": true, "amm_trades_excluded": 0}, "skill": {"rated": false, "floor": {"markets": 30, "events": 3}, "horizon_hours": 12, "markets": 0, "events": 0, "brier": null, "edge": null, "edge_se": null, "calibration": []}, "wash": {"scored": true, "score": 0.1473294119672094, "paired_volume": {"raw": "1155426988216", "decimals": 6, "symbol": "shares", "value": "1155426.988216"}, "flagged_volume": {"raw": "0", "decimals": 6, "symbol": "shares", "value": "0"}, "flagged_share": 0, "algorithm": "columbia-2", "evidence": {"counterparties": [], "trades": []}}, "coverage": {"note": "Polymarket history through 2026-04-24 07:43:40 UTC (Polygon block 85,948,288). Order-book trades start on 2022-11-21. Later trades are not included. Trades on the old automated market maker are not part of profit and loss.", "through": {"block": 85948288, "time": "2026-04-24T07:43:40Z"}, "revision": "7eeb860dea5b79d5c74f3182b70bd08c85c8f833", "attribution": "Polymarket history: Envio, CC-BY-4.0", "license_url": "https://creativecommons.org/licenses/by/4.0/", "modified": "Modified by Sona: source rows were aggregated into per-wallet and per-market figures. Not affiliated with or endorsed by Polymarket or Envio.", "source_url": "https://huggingface.co/datasets/moose-code/polymarket-onchain-v1"}}
                rated:
